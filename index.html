<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24675F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rehab log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EEEC; --surface:#F8FBFA; --raised:#FFFFFF; --ink:#16272B; --muted:#56686C; --line:#C9D5D2;
  --accent:#24675F; --accent-soft:#D3E7E3; --on-accent:#FFFFFF;
  --right:#B97A06; --right-soft:#F5E6C3; --danger:#B3261E; --danger-soft:#F8DDDA; --warn-soft:#FBEFD2;
  --rest:#6F8589;
  --display:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E191C; --surface:#16252A; --raised:#1C2E33; --ink:#E3ECEA; --muted:#9AAEB1; --line:#2C4248;
    --accent:#4FB3A6; --accent-soft:#183C39; --on-accent:#08201D;
    --right:#E7AE3C; --right-soft:#3A2E12; --danger:#F2867D; --danger-soft:#3D1A18; --warn-soft:#3A2E12;
    --rest:#7E9599; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E191C; --surface:#16252A; --raised:#1C2E33; --ink:#E3ECEA; --muted:#9AAEB1; --line:#2C4248;
  --accent:#4FB3A6; --accent-soft:#183C39; --on-accent:#08201D;
  --right:#E7AE3C; --right-soft:#3A2E12; --danger:#F2867D; --danger-soft:#3D1A18; --warn-soft:#3A2E12;
  --rest:#7E9599; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:18px 16px 170px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0}
h1{font-size:2.4rem;letter-spacing:.01em}
h2{font-size:1.6rem;margin:26px 0 10px}
h3{font-size:1.3rem}
p{margin:0 0 8px}
.sub{color:var(--muted);margin-top:4px}
.small{font-size:.9rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.cloud{font-size:.82rem;color:var(--muted);margin-top:6px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.95rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:1.05rem;padding:10px 14px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn+.btn{margin-top:10px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.row .btn+.btn{margin-top:0}
.action{display:block;text-align:left;width:100%;background:var(--raised);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:10px}
.action strong{display:block;font-family:var(--display);font-size:1.45rem;font-weight:700}
.action span{color:var(--muted);font-size:.95rem}
.action.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.action.main span{color:var(--on-accent);opacity:.85}
.alert{border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid}
.alert.danger{background:var(--danger-soft);border-color:var(--danger)}
.alert.warn{background:var(--warn-soft);border-color:var(--right)}
.alert strong{display:block;margin-bottom:4px}
/* sliders */
.sl{display:block;margin:6px 0 18px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.sl-top output{font-family:var(--display);font-size:1.8rem;font-weight:700;min-width:2ch;text-align:right}
.sl input{width:100%;accent-color:var(--accent);height:34px;margin:2px 0}
.sl-ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.sl.r .sl-top output{color:var(--right)}
.sl.r input{accent-color:var(--right)}
/* chips */
.q{margin:4px 0 18px}
.q>p{font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:9px 14px;font-size:.95rem;min-height:42px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
/* exercises */
.block-title{display:flex;justify-content:space-between;align-items:baseline}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ex.complete{border-color:var(--accent)}
.ex-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.target{color:var(--muted);font-size:.92rem;margin:4px 0 0}
.count{font-family:var(--display);font-size:1.5rem;font-weight:700;color:var(--muted);white-space:nowrap}
.ex.complete .count{color:var(--accent)}
.set{display:grid;grid-template-columns:50px 1fr 56px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.set-n{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--muted);white-space:nowrap}
.set-body{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stepper{display:inline-grid;grid-template-columns:40px 46px 40px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--raised);overflow:hidden}
.stepper button{border:0;background:none;height:44px;font-size:1.3rem}
.stepper .v{text-align:center;font-family:var(--display);font-size:1.4rem;font-weight:700}
.side{display:inline-flex;align-items:center;gap:4px}
.side b{font-family:var(--display);font-size:1.1rem;width:16px;text-align:center}
.side.r b{color:var(--right)}
.side.r .stepper{border-color:var(--right)}
.kg{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:.9rem}
.kg input{width:62px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink);font:inherit;font-size:1.05rem;text-align:center}
.done{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--raised);font-size:1.4rem;justify-self:end}
.done.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.holdbtn{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 12px;min-height:44px;font-weight:600}
.holdbtn.r{border-color:var(--right)}
.holdbtn.got{background:var(--accent-soft)}
.ex-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.ex-foot select,.field select{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink);font:inherit;padding:0 10px}
.toggle{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 12px;min-height:44px;font-size:.95rem}
.toggle.on{background:var(--right-soft);border-color:var(--right);font-weight:600}
.note{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink);font:inherit;font-size:.95rem;padding:10px}
textarea.note{min-height:70px;resize:vertical}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-weight:600;margin-bottom:6px}
.field input[type=text],.field input[type=number],.field input:not([type]){width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink);font:inherit;padding:0 10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .field input{text-align:center}
.r-label{color:var(--right)}
.sticky-foot{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:16px}
/* timer ring */
.ringwrap{position:relative;width:240px;max-width:72vw;aspect-ratio:1;margin:10px auto 14px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:12}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;stroke-dasharray:552.9;stroke-dashoffset:0;transition:stroke-dashoffset .2s linear}
.ring-fg.rest{stroke:var(--rest)}
.ring-fg.ready{stroke:var(--right)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-time{font-family:var(--display);font-weight:700;font-size:4.2rem;line-height:1;font-variant-numeric:tabular-nums}
.ring-phase{font-family:var(--display);font-size:1.5rem;font-weight:600}
.ring-sub{color:var(--muted);font-size:.95rem}
/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 97%,transparent);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.overlay-box{width:100%;max-width:420px;text-align:center}
.overlay-box h3{font-size:1.7rem}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;max-height:80vh;overflow:auto}
.modal textarea{width:100%;min-height:240px;font-size:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink);padding:8px}
/* rest bar */
.restbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;padding:0 10px 8px}
.restbar-in{position:relative;overflow:hidden;width:100%;max-width:540px;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 10px 8px 16px}
.rest-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.45;transition:width .2s linear}
.restbar-in>*{position:relative}
.restbar-in strong{font-family:var(--display);font-size:1.9rem;font-variant-numeric:tabular-nums;margin-right:auto;margin-left:6px}
.restbar-in button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:10px;min-height:44px;min-width:50px;font-weight:600}
.restbar-in.over{background:var(--accent);color:var(--on-accent)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;height:64px;font-size:.88rem;padding:0 2px;color:var(--muted);font-weight:600;border-top:3px solid transparent}
nav.tabs button.on{color:var(--ink);border-top-color:var(--accent)}
/* charts & lists */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 14px}
.seg button{flex:1;border:0;background:var(--raised);min-height:44px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.bal{margin:10px 0 14px}
.bal-name{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.bal-name span{color:var(--muted);font-weight:400;font-size:.9rem}
.bal-bar{display:grid;grid-template-columns:18px 1fr 44px;gap:8px;align-items:center;margin-top:5px}
.bal-bar b{font-family:var(--display)}
.bal-bar .track{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.bal-bar .fill{height:100%;background:var(--accent);border-radius:7px}
.bal-bar.r b,.bal-bar.r .num{color:var(--right)}
.bal-bar.r .fill{background:var(--right)}
.bal-bar .num{font-family:var(--display);font-size:1.1rem;text-align:right}
table.ext{width:100%;border-collapse:collapse;font-size:.92rem}
table.ext th{text-align:left;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
table.ext td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.ext td.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.log-item{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:block}
.log-item strong{display:block}
.log-detail{background:var(--raised);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;margin:-12px 0 8px;padding:12px 14px;font-size:.92rem}
.log-detail p{margin:0 0 4px}
details.card>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.card>summary::after{content:"+";font-family:var(--display);font-size:1.4rem;line-height:1}
details.card[open]>summary::after{content:"\2212"}
details.card>summary::-webkit-details-marker{display:none}
.flag{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.flag input{width:22px;height:22px;margin-top:2px;accent-color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
.prog-item{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.checks{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.checks label{display:flex;gap:6px;align-items:center}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.quick button{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:10px 8px;min-height:66px;font-weight:600;font-size:.92rem;line-height:1.2}
.pe{border-top:1px solid var(--line);padding:12px 0}
.pe:first-of-type{border-top:0}
.pe h3{font-size:1.25rem}
.pe.paused h3,.pe.paused .target{opacity:.55}
.badge{display:inline-block;font-family:var(--body);font-size:.75rem;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:middle;background:var(--warn-soft);border:1px solid var(--right)}
.pe-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini{border:1px solid var(--line);background:var(--raised);border-radius:10px;min-height:42px;min-width:44px;padding:6px 11px;font-size:.92rem;font-weight:600}
.mini:disabled{opacity:.3}
.editor{background:var(--raised);border:2px solid var(--accent);border-radius:14px;padding:14px;margin:10px 0}
.chg{padding:6px 0 6px 12px;border-left:4px solid var(--line);margin:8px 0}
.chg.add{border-color:var(--accent)}
.chg.remove{border-color:var(--danger)}
.chg.change{border-color:var(--right)}
.chg strong{display:block}
.chg span{color:var(--muted);font-size:.92rem}
.cue h3{margin:18px 0 6px;font-size:1.2rem}
.cue ol,.cue ul{margin:0;padding-left:22px}
.cue li{margin:5px 0}
.disclaim{font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:16px}
a.btn{text-decoration:none;color:inherit}
.q-item{border-top:1px solid var(--line);padding:10px 0}
.q-item p{margin:0 0 4px}
.rt-grid{display:grid;grid-template-columns:1.3fr 1fr .8fr .8fr 40px;gap:6px;align-items:center;margin-bottom:8px}
.rt-grid.head{font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.rt-grid input{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink);font:inherit;font-size:.95rem;padding:0 6px}
.rt-grid .r-in{border-color:var(--right)}
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted);padding:6px 0 12px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.backlink{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;min-height:44px;margin-bottom:2px}
.field input[type=date],.field input[type=time]{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink);font:inherit;padding:0 10px}
label.btn{position:relative;overflow:hidden;cursor:pointer}
.fileov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.pastebox{border:2px dashed var(--line);border-radius:12px;padding:14px;min-height:56px;color:var(--muted);text-align:center;margin-top:10px;outline:none}
.pastebox:focus{border-color:var(--accent);color:var(--ink)}
.diag td{vertical-align:top}
.ok{color:var(--accent);font-weight:700}
.bad{color:var(--danger);font-weight:700}
#camv{width:100%;max-height:60vh;border-radius:14px;background:#000;display:block}
.legq{margin:2px 0 6px}
.legq-t{font-weight:600;margin:0 0 4px}
.legpair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sl.leg{margin:2px 0 4px}
.sl.leg .sl-top output{font-size:2rem}
.sidetag{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;font-family:var(--display);font-size:1rem;font-weight:700;margin-right:6px;background:var(--accent-soft);color:var(--ink)}
.sidetag.r{background:var(--right-soft)}
.sl.z1 output{color:var(--accent)}
.sl.z1 input{accent-color:var(--accent)}
.sl.z2 output{color:var(--right)}
.sl.z2 input{accent-color:var(--right)}
.sl.z3 output{color:var(--danger)}
.sl.z3 input{accent-color:var(--danger)}
.legdiff{font-weight:600;font-size:.95rem;margin:4px 0 16px;padding:8px 12px;border-radius:10px;background:var(--bg)}
.legdiff.mid{background:var(--warn-soft)}
.legdiff.bad{background:var(--danger-soft);color:var(--danger)}
.toggle.l.on{background:var(--accent-soft);border-color:var(--accent)}
.report h1{font-size:1.8rem}
.report h2{font-size:1.25rem;margin:20px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.report section p{margin:4px 0}
.report ol{padding-left:22px;margin:4px 0}
.rep-note,.rep-src{color:var(--muted);font-size:.9rem}
.report td.n{white-space:nowrap}
.rep-bad{color:var(--danger);font-weight:700}
.rep-foot{margin-top:18px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:8px}
@media print{nav.tabs,.noprint,.backlink,#rest,#toast{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card.report{border:0;padding:0}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="main"></main>

<div id="rest" class="restbar" hidden>
  <div class="restbar-in" id="rest-in">
    <div class="rest-fill" id="rest-fill"></div>
    <span>Rest</span>
    <strong id="rest-time">1:30</strong>
    <button data-a="rest-sub" aria-label="Remove 15 seconds">−15</button>
    <button data-a="rest-add" aria-label="Add 15 seconds">+15</button>
    <button data-a="rest-skip">Done</button>
  </div>
</div>

<div id="hold" class="overlay" hidden>
  <div class="overlay-box">
    <h3 id="hold-name"></h3>
    <div class="ringwrap">
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-bg" cx="100" cy="100" r="88"/><circle id="hold-ring" class="ring-fg ready" cx="100" cy="100" r="88"/></svg>
      <div class="ring-center"><div class="ring-phase" id="hold-phase">Get set</div><div class="ring-time" id="hold-time">5</div></div>
    </div>

      <button class="btn ghost" data-a="hold-cancel">Cancel</button>
    </div>

  </div>
</div>

<div id="modal" class="overlay" hidden><div class="overlay-box"><div class="modal" id="modal-body"></div></div></div>

<nav class="tabs"><div class="in">
  <button data-a="nav" data-v="home">Today</button>

</div></nav>

<script>
(function(){
"use strict";

/* ---------- program (from TC_Gym_Program_Sept_2026.xlsx) ---------- */
const DEFAULT_PROGRAM = {
  warmup:[
    {id:"gbe", name:"Glute bridge extender", sets:2, target:"8 reps", kind:"reps", reps:8, rpe:5},
    {id:"spl", name:"Side plank (short lever)", sets:2, target:"20 s each side", kind:"time", secs:20, rpe:5, sided:true},
    {id:"fpl", name:"Front plank leg lift", sets:2, target:"30 s", kind:"time", secs:30, rpe:5, notes:"Maintain neutral lumbar spine"},
    {id:"crab", name:"Crab walk", sets:5, target:"5 m", kind:"distance", rpe:5, notes:"Band around ankles"},

  ],
  gym:[

    {id:"shb", name:"Swiss ball hamstring bridge", sets:2, target:"10–12 reps", kind:"reps", reps:12, rpe:5},
    {id:"rgl", name:"Reverse goblet lunge", sets:2, target:"10–12 reps each side", kind:"reps", reps:12, rpe:5, notes:"5 kg", weight:true, kg:5, sided:true},
    {id:"rdl", name:"Single leg block RDL", sets:2, target:"6–8 reps each side", kind:"reps", reps:8, rpe:5, notes:"5 kg", weight:true, kg:5, sided:true},
    {id:"lpd", name:"Lat pull down", sets:2, target:"10–12 reps", kind:"reps", reps:12, rpe:5, weight:true},
    {id:"icp", name:"Incline chest press", sets:2, target:"10–12 reps", kind:"reps", reps:12, rpe:5, weight:true}
  ],
  conditioning:[
    {id:"A", erg:"Ski", work:45, rest:30, sets:8, rpe:5},
    {id:"B", erg:"Ski", work:30, rest:15, sets:12, rpe:8},
    {id:"C", erg:"Assault bike", work:240, rest:60, sets:4, rpe:7},
    {id:"D", erg:"Assault bike", work:30, rest:15, sets:12, rpe:8},
    {id:"E", erg:"Bike", work:40, rest:20, sets:10, rpe:8},
    {id:"F", erg:"Bike", work:300, rest:120, sets:3, rpe:5}
  ]
};
const SIT = [{v:20,l:"Under 30 min"},{v:45,l:"30–60 min"},{v:75,l:"60–90 min"},{v:105,l:"90 min–2 h"},{v:150,l:"Over 2 h"},{v:999,l:"No heaviness from sitting"}];
const STAND = [{v:10,l:"Under 15 min"},{v:22,l:"15–30 min"},{v:45,l:"30–60 min"},{v:75,l:"Over 60 min"},{v:999,l:"No heaviness from standing"}];
const WALK = [{v:0,l:"None"},{v:15,l:"Under 30 min"},{v:45,l:"30–60 min"},{v:90,l:"1–2 h"},{v:150,l:"Over 2 h"}];
const FLAGS = [
  "Leg weakness getting rapidly worse",
  "New difficulty walking normally",
  "New numbness in the groin or saddle area",
  "New loss of bladder or bowel control",
  "Severe, rapidly worsening back pain with leg changes"
];

/* ---------- storage ---------- */
const LS = {rec:"rl.records.v1", set:"rl.settings.v1", act:"rl.active.v1", tomb:"rl.tombs.v1"};
function load(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const clone = o => JSON.parse(JSON.stringify(o));

const S = {
  view:"home",
  records: load(LS.rec, {}),
  settings: load(LS.set, null) || {program: clone(DEFAULT_PROGRAM), restSec:90, updatedAt:0},
  active: load(LS.act, null),
  tombs: load(LS.tomb, {}),
  checkin:null, histTab:"trends", open:{}, imp:null, edit:null, rt:null, q:{text:"",who:"GP"}, sym:null, guide:null, guideBack:"program", ob:{}, inbox:null, tol:load("rl.tol.v1",null), tolDraft:null, tolQ:0, rep:{days:28, who:"GP"}, flight:load("rl.flight.v1",null)
};
function persist(){ store(LS.rec,S.records); store(LS.set,S.settings); store(LS.act,S.active); store(LS.tomb,S.tombs); }
function saveActive(){ store(LS.act,S.active); }
function putRecord(r){ r.updatedAt = Date.now(); S.records[r.id] = r; persist(); }
function delRecord(id){ delete S.records[id]; persist(); }
function stripMeta(r){ const c = clone(r); delete c._synced; return c; }

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => iso(new Date());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d,12); };
const fmtLong = s => parseD(s).toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = s => parseD(s).toLocaleDateString("en-AU",{day:"numeric",month:"short"});
const mmss = sec => { sec = Math.max(0,Math.ceil(sec)); return Math.floor(sec/60)+":"+pad(sec%60); };
const uid = () => "s-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const labelOf = (list,v) => { const o = list.find(x=>x.v===v); return o ? o.l : "Not answered"; };
function setPath(o,p,v){ const ks = p.split("."); let x = o; for(let k=0;k<ks.length-1;k++){ if(x[ks[k]]==null) x[ks[k]] = /^\d+$/.test(ks[k+1]) ? [] : {}; x = x[ks[k]]; } x[ks[ks.length-1]] = v; }
function getPath(o,p){ return p.split(".").reduce((x,k)=> x==null ? x : x[k], o); }
function rootFor(pre){ return ({a:S.active, c:S.checkin, p:S.settings.program, s:S.settings, e:S.edit&&S.edit.draft, t:S.rt, y:S.sym, q:S.q, i:S.imp, r:S.rep, w:S.tolDraft, f:S.flight})[pre] || null; }
function setBind(b,v){
  const pre = b[0], path = b.slice(2), root = rootFor(pre); if(!root) return;
  setPath(root,path,v);
  if(pre==="a") saveActive();
  if(pre==="f") saveFlight();
  if(pre==="p" || pre==="s"){ S.settings.updatedAt = Date.now(); persist(); }
}
function recs(types){ return Object.values(S.records).filter(r=>types.includes(r.type)).sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : (a.startedAt||0)-(b.startedAt||0)); }
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 2600); }

/* ---------- sound, vibration, screen ---------- */
let AC = null;
function unlockAudio(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){} }
function beep(f,d){ try{ if(!AC) return; const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; o.connect(g); g.connect(AC.destination); const t = AC.currentTime; g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.start(t); o.stop(t+d); }catch(e){} }
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
let wake = null;
async function keepAwake(on){ try{ if(on && !wake && navigator.wakeLock){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{ wake = null; }); } else if(!on && wake){ await wake.release(); wake = null; } }catch(e){} }

/* ---------- program week ---------- */
function programWeek(){
  const st = recs(["strength"]); const start = S.settings.programStart || (st[0] && st[0].date);
  if(!start) return null;
  const w = Math.floor((parseD(today()) - parseD(start)) / (7*864e5)) + 1;
  return Math.max(1,w);
}

/* ---------- alerts ---------- */
function alerts(){
  const out = []; const cis = recs(["checkin"]); const last = cis[cis.length-1];
  if(last){
    const age = (parseD(today()) - parseD(last.date)) / 864e5;
    if(age <= 2 && last.flags && Object.values(last.flags).some(Boolean)){
      out.push(`<div class="alert danger"><strong>Get urgent medical assessment</strong>Your check-in on ${esc(fmtShort(last.date))} noted a warning sign. Don't wait for your planned review. For new bladder or bowel changes or saddle numbness, go to an emergency department now.</div>`);
    }
    [["strength","Right"],["strengthL","Left"]].forEach(([k,side])=>{
    const prev = cis.slice(-8,-1).filter(c=>typeof c[k]==="number");
    if(age <= 2 && prev.length >= 3 && typeof last[k]==="number"){
      const avg = prev.reduce((s,c)=>s+c[k],0)/prev.length;
      if(last[k] <= avg - 3){
        out.push(`<div class="alert warn"><strong>${side} leg feels weaker than usual</strong>You rated it ${last[k]}/10 against a recent average of ${avg.toFixed(1)}. Your plan is to escalate early if weakness worsens, so consider calling your GP.</div>`);
      }
    }
    });
  }
  return out.join("");
}

/* ---------- views ---------- */
function slider(bind,label,val,lo,hi,isR){
  const id = "o"+bind.replace(/\W/g,"");
  return `<label class="sl${isR?" r":""}"><span class="sl-top"><span>${label}</span><output id="${id}">${val}</output></span>
  <input type="range" min="0" max="10" step="1" value="${val}" data-bind="${bind}" data-out="${id}" data-num="1" aria-label="${esc(label)}">
  <span class="sl-ends"><span>${lo}</span><span>${hi}</span></span></label>`;
}
/* left and right leg ratings, coloured by fatigue */
const fat = (v,inv) => inv ? 10-(v??0) : (v??0);
const zoneOf = (v,inv) => { const f = fat(v,inv); return f<=3 ? "z1" : f<=6 ? "z2" : "z3"; };
function legDiff(vL,vR,inv){
  if(vL==null || vR==null) return {t:"", c:""};
  const d = fat(vR,inv) - fat(vL,inv), a = Math.abs(d);
  if(a<2) return {t:"Left and right about even", c:""};
  const side = d>0 ? "Right" : "Left";
  return {t:`${side} ${a} point${a>1?"s":""} ${inv?"weaker":"heavier"} than the other`, c:a>=3?"bad":"mid"};
}
function legHalf(side,bind,v,lo,hi,inv){
  const id = "o"+bind.replace(/\W/g,""), val = v??(inv?10:0);
  return `<label class="sl leg ${zoneOf(val,inv)}"><span class="sl-top"><span><span class="sidetag${side==="R"?" r":""}">${side}</span>${side==="L"?"Left":"Right"}</span><output id="${id}">${val}</output></span>
    <input type="range" min="0" max="10" step="1" value="${val}" data-bind="${bind}" data-out="${id}" data-num="1" data-leg="${inv?"inv":"1"}" aria-label="${side==="L"?"Left":"Right"} leg">
    <span class="sl-ends"><span>${lo}</span><span>${hi}</span></span></label>`;
}
function legPair(title,bindL,bindR,vL,vR,lo,hi,inv){
  const L = vL??(inv?10:0), R = vR??(inv?10:0), d = legDiff(L,R,inv);
  return `<div class="legq"><p class="legq-t">${title}</p><div class="legpair">${legHalf("L",bindL,L,lo,hi,inv)}${legHalf("R",bindR,R,lo,hi,inv)}</div>
    <p class="legdiff ${d.c}" data-diff="1">${esc(d.t)}</p></div>`;
}
function updLeg(input){
  const inv = input.dataset.leg==="inv", lab = input.closest(".sl"), q = input.closest(".legq");
  lab.classList.remove("z1","z2","z3"); lab.classList.add(zoneOf(Number(input.value),inv));
  const ins = q.querySelectorAll("input[data-leg]"), d = legDiff(Number(ins[0].value),Number(ins[1].value),inv);
  const el = q.querySelector("[data-diff]"); el.textContent = d.t; el.className = "legdiff "+d.c;
}
function symptomSliders(pre,obj){
  return slider(pre+".back","Back load or pressure",obj.back,"None","Worst")
    + legPair("Leg heaviness or fatigue",pre+".heavyL",pre+".heavy",obj.heavyL,obj.heavy,"None","Worst",false)
    + legPair("Leg strength feel",pre+".strengthL",pre+".strength",obj.strengthL,obj.strength,"Gives way","Normal",true);
}
function chips(bind,list,cur){
  return `<div class="chips">${list.map(o=>`<button class="chip${cur===o.v?" on":""}" data-a="chip" data-bind="${bind}" data-val="${o.v}">${esc(o.l)}</button>`).join("")}</div>`;
}
function lastSymptoms(){
  const all = recs(["strength","conditioning","checkin"]).reverse();
  for(const r of all){
    if(r.type==="checkin") return {back:r.back??0, heavy:r.peak??0, heavyL:r.peakL??0, strength:r.strength??10, strengthL:r.strengthL??10};
    if(r.post) return Object.assign({heavyL:0, strengthL:10}, clone(r.post));
  }
  return {back:0, heavy:0, heavyL:0, strength:10, strengthL:10};
}
function cloudLine(){ const d = lastBackupDays(); return `<p class="cloud" id="cloud">Saved on this phone. ${d===null?"No backup yet":d===0?"Backed up today":`Last backup ${d} day${d>1?"s":""} ago`}</p>`; }

function viewHome(){
  const t = today(), ci = S.records["c-"+t], wk = programWeek();
  const sessions = recs(["strength","conditioning"]); const lastS = sessions[sessions.length-1];
  let html = `<header class="top"><div><h1>Rehab log</h1><p class="sub">${esc(fmtLong(t))}${wk?`<br>Program week ${wk}`:""}</p>${cloudLine()}</div></header>`;
  html += alerts() + backupBanner();
  if(S.active){
    html += `<button class="action main" data-a="nav" data-v="session"><strong>Resume your session</strong><span>${S.active.type==="strength"?"Strength":"Conditioning"} session started ${new Date(S.active.startedAt).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"})}</span></button>`;
  } else {
    html += `<button class="action main" data-a="start-strength"><strong>Start strength session</strong><span>Warm-up and gym exercises, with rest and hold timers</span></button>
      <button class="action" data-a="start-cond"><strong>Start conditioning</strong><span>Interval timer for sessions A to F</span></button>`;
  }
  html += `<button class="action" data-a="nav" data-v="checkin"><strong>${ci?"Edit tonight's check-in":"Evening check-in"}</strong><span>${ci?`Heaviness ${ci.peakL!=null?`L ${ci.peakL} / `:""}R ${ci.peak}. Sitting: ${esc(labelOf(SIT,ci.sit))}`:"About a minute. How the day went while you were at work"}</span></button>`;
  html += S.tol ? `<button class="action main" data-a="nav" data-v="tol"><strong>${S.tol.pos==="sit"?"Sitting":"Standing"} test running</strong><span>Started ${new Date(S.tol.startedAt).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"})}. Tap to return to the timer.</span></button>`
    : `<button class="action" data-a="nav" data-v="tol"><strong>Tolerance test</strong><span>Time how long you can sit or stand before heaviness starts</span></button>`;
  html += `<div class="quick"><button data-a="sym-new">Log a symptom change</button><button data-a="nav" data-v="questions">Add a question</button><button data-a="rt-new">Add physio results</button></div>`;
  const openQ = recs(["question"]).filter(q=>!q.answered);
  if(openQ.length){
    html += `<button class="action" data-a="nav" data-v="questions"><strong>${openQ.length} open question${openQ.length>1?"s":""}</strong><span>${openQ.slice(0,3).map(q=>esc(q.text.length>60?q.text.slice(0,57)+"…":q.text)).join("<br>")}</span></button>`;
  }
  html += S.flight && S.flight.stage!=="setup" ? `<button class="action main" data-a="nav" data-v="flight"><strong>Flight Mode running</strong><span>${S.flight.stage==="break"?"A break is due now":"Tap to return to the break timer"}</span></button>`
    : `<button class="action" data-a="nav" data-v="flight"><strong>Flight Mode</strong><span>Movement-break timer for long flights</span></button>`;
  html += `<button class="action" data-a="rep-open"><strong>Clinic report</strong><span>A one-page summary for your GP, physio or neurologist</span></button>`;
  if(lastS){
    const d = lastS.pre && lastS.post ? lastS.post.heavy - lastS.pre.heavy : null;
    html += `<div class="card"><h3>Last session</h3><p class="sub">${esc(fmtLong(lastS.date))}: ${lastS.type==="strength"?"strength":"conditioning "+esc(lastS.cond?lastS.cond.pid:"")}</p>
      ${d===null?"":`<p>${lastS.pre.heavyL!=null&&lastS.post.heavyL!=null?`Left heaviness ${lastS.pre.heavyL} to ${lastS.post.heavyL}. `:""}Right heaviness ${lastS.pre.heavy} to ${lastS.post.heavy}${d<0?", easier afterwards.":d>0?", heavier afterwards.":", no change."}</p>`}</div>`;
  }
  return html;
}

/* session */
function buildEx(p,block){
  const last = lastExLog(p.id); const log = [];
  for(let j=0;j<p.sets;j++){
    const pl = last && last.log[j];
    const pick = (k,def) => pl && pl[k]!=null ? pl[k] : def;
    const isReps = p.kind==="reps";
    log.push({
      reps: isReps && !p.sided ? pick("reps",p.reps) : null,
      repsL: isReps && p.sided ? pick("repsL",p.reps) : null,
      repsR: isReps && p.sided ? pick("repsR",p.reps) : null,
      kg: p.weight ? pick("kg", p.kg!=null ? p.kg : null) : null,
      secs:null, secsL:null, secsR:null, done:false
    });
  }
  return {pid:p.id, name:p.name, block, kind:p.kind, sided:!!p.sided, weight:!!p.weight, target:p.target, rpeTarget:p.rpe, notes:p.notes||"", secs:p.secs||null, log, rpe:null, rOff:false, note:""};
}
function lastExLog(pid){
  const st = recs(["strength"]).reverse();
  for(const r of st){ const e = (r.ex||[]).find(x=>x.pid===pid); if(e) return e; }
  return null;
}
function startStrength(){
  const P = S.settings.program;
  S.active = {id:uid(), type:"strength", date:today(), startedAt:Date.now(), stage:"pre", pre:lastSymptoms(), post:null, notes:"",
    ex:[...P.warmup.filter(p=>!p.paused).map(p=>buildEx(p,"Warm-up")), ...P.gym.filter(p=>!p.paused).map(p=>buildEx(p,"Gym"))]};
  saveActive(); resetTimers(); go("session");
}
function startCond(){
  S.active = {id:uid(), type:"conditioning", date:today(), startedAt:Date.now(), stage:"pre", pre:lastSymptoms(), post:null, notes:"", cond:null};
  saveActive(); resetTimers(); go("session");
}

function viewSession(){
  const a = S.active;
  if(!a){
    return `<header class="top"><div><h1>Session</h1><p class="sub">Pick what you're doing today.</p></div></header>
      <button class="action main" data-a="start-strength"><strong>Strength session</strong><span>Warm-up and gym exercises</span></button>
      <button class="action" data-a="start-cond"><strong>Conditioning</strong><span>Intervals on the ski, assault bike or bike</span></button>`;
  }
  const title = a.type==="strength" ? "Strength session" : "Conditioning";
  if(a.stage==="pre"){
    let html = `<header class="top"><div><h1>${title}</h1><p class="sub">Before you start, how are you right now?</p></div></header>
      <div class="card">${symptomSliders("a:pre",a.pre)}</div>`;
    if(a.type==="conditioning"){
      html += `<h2>Which session?</h2>` + S.settings.program.conditioning.map(c=>{
        const on = a.cond && a.cond.pid===c.id;
        return `<button class="action${on?" main":""}" data-a="pick-cond" data-id="${esc(c.id)}"><strong>${esc(c.id)}: ${esc(c.erg)}</strong><span>${c.sets} rounds of ${mmss(c.work)} work, ${mmss(c.rest)} easy. Target RPE ${c.rpe}</span></button>`;
      }).join("");
    }
    html += `<div style="margin-top:14px"><button class="btn primary" data-a="begin"${a.type==="conditioning"&&!a.cond?" disabled":""}>Start session</button>
      <button class="btn ghost" data-a="discard">Discard</button></div>`;
    return html;
  }
  if(a.stage==="post"){
    return `<header class="top"><div><h1>Finished</h1><p class="sub">How do you feel now?</p></div></header>
      <div class="card">${symptomSliders("a:post",a.post)}
      <label class="field"><span>Notes</span><textarea class="note" data-bind="a:notes" placeholder="Anything worth remembering for your physio">${esc(a.notes)}</textarea></label></div>
      <button class="btn primary" data-a="save-session">Save session</button>
      <button class="btn ghost" data-a="back-work">Back to exercises</button>`;
  }
  return a.type==="strength" ? strengthWork(a) : condWork(a);
}

function strengthWork(a){
  let html = `<header class="top"><div><h1>Strength</h1><p class="sub">Tap the circle when a set is done. Rest starts automatically.</p></div></header>`;
  let block = null;
  a.ex.forEach((ex,i)=>{
    if(ex.block!==block){ block = ex.block; html += `<h2>${esc(block)}</h2>`; }
    html += exCard(ex,i);
  });
  html += `<div class="sticky-foot"><button class="btn primary" data-a="finish">Finish session</button></div>`;
  return html;
}
function stepper(bind,val,label){
  return `<span class="stepper"><button data-a="step" data-bind="${bind}" data-d="-1" aria-label="Fewer ${label}">−</button><span class="v">${val==null?0:val}</span><button data-a="step" data-bind="${bind}" data-d="1" aria-label="More ${label}">+</button></span>`;
}
function exCard(ex,i){
  const done = ex.log.filter(s=>s.done).length;
  const rows = ex.log.map((s,j)=>{
    const b = `a:ex.${i}.log.${j}`;
    let body = "";
    if(ex.kind==="reps"){
      body += ex.sided
        ? `<span class="side"><b>L</b>${stepper(b+".repsL",s.repsL,"left reps")}</span><span class="side r"><b>R</b>${stepper(b+".repsR",s.repsR,"right reps")}</span>`
        : stepper(b+".reps",s.reps,"reps");
    } else if(ex.kind==="time"){
      if(ex.sided){
        body += `<button class="holdbtn${s.secsL!=null?" got":""}" data-a="hold" data-i="${i}" data-j="${j}" data-side="L">${s.secsL!=null?`L ${s.secsL} s`:`Hold left ${ex.secs} s`}</button>`;
        body += `<button class="holdbtn r${s.secsR!=null?" got":""}" data-a="hold" data-i="${i}" data-j="${j}" data-side="R">${s.secsR!=null?`R ${s.secsR} s`:`Hold right ${ex.secs} s`}</button>`;
      } else {
        body += `<button class="holdbtn${s.secs!=null?" got":""}" data-a="hold" data-i="${i}" data-j="${j}" data-side="">${s.secs!=null?`Held ${s.secs} s`:`Start ${ex.secs} s hold`}</button>`;
      }
    } else {
      body += `<span class="small">${esc(ex.target)}</span>`;
    }
    if(ex.weight) body += `<label class="kg"><input type="number" inputmode="decimal" step="0.5" value="${s.kg==null?"":s.kg}" data-bind="${b}.kg" data-num="1" aria-label="Weight in kg">kg</label>`;
    return `<div class="set"><span class="set-n">Set ${j+1}</span><div class="set-body">${body}</div><button class="done${s.done?" on":""}" data-a="done" data-i="${i}" data-j="${j}" aria-label="Set ${j+1} done" aria-pressed="${s.done}">${s.done?"✓":""}</button></div>`;
  }).join("");
  const rpeOpts = `<option value="">How hard? (RPE)</option>` + Array.from({length:10},(_,k)=>`<option value="${k+1}"${ex.rpe===k+1?" selected":""}>RPE ${k+1}</option>`).join("");
  return `<div class="ex${done===ex.log.length?" complete":""}">
    <div class="ex-head"><div><h3>${esc(ex.name)}</h3><p class="target">${ex.log.length} × ${esc(ex.target)}${ex.rpeTarget?`, RPE ${ex.rpeTarget}`:""}${ex.notes?`. ${esc(ex.notes)}`:""}</p></div><span class="count">${done}/${ex.log.length}</span></div>
    ${rows}
    <div class="ex-foot">
      <select data-bind="a:ex.${i}.rpe" data-num="1" aria-label="Actual effort">${rpeOpts}</select>
      <button class="toggle l${ex.lOff?" on":""}" data-a="loff" data-i="${i}" aria-pressed="${!!ex.lOff}">Left felt off</button>
      <button class="toggle${ex.rOff?" on":""}" data-a="roff" data-i="${i}" aria-pressed="${ex.rOff}">Right felt off</button>
      <button class="toggle" data-a="guide" data-src="a" data-i="${i}">Form guide</button>
      <input class="note" data-bind="a:ex.${i}.note" value="${esc(ex.note)}" placeholder="Note (optional)">
    </div></div>`;
}

function condWork(a){
  const c = a.cond;
  const phase = T.mode==="interval" ? T.phase : null;
  const left = T.mode==="interval" ? (T.running ? T.endAt-Date.now() : T.left) : c.work*1000;
  const phaseLabel = {ready:"Get ready", work:"Work", rest:"Easy", done:"All rounds done"}[phase] || "Ready when you are";
  const ringCls = phase==="rest" ? "rest" : phase==="ready" ? "ready" : "";
  const frac = phase && phase!=="done" && T.dur ? left/T.dur : 1;
  const ctrl = !phase || phase==="done"
    ? `<button class="btn primary" data-a="iv-start">${phase==="done"?"Run again":"Start intervals"}</button>`
    : T.running ? `<button class="btn" data-a="iv-pause">Pause</button>` : `<button class="btn primary" data-a="iv-start">Resume</button>`;
  return `<header class="top"><div><h1>${esc(c.pid)}: ${esc(c.erg)}</h1><p class="sub">${c.sets} rounds of ${mmss(c.work)} work, ${mmss(c.rest)} easy. Target RPE ${c.rpeTarget}.</p></div></header>
    <div class="card">
      <div class="ringwrap"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-bg" cx="100" cy="100" r="88"/><circle id="iv-ring" class="ring-fg ${ringCls}" cx="100" cy="100" r="88" style="stroke-dashoffset:${(552.9*(1-Math.max(0,Math.min(1,frac)))).toFixed(1)}"/></svg>
        <div class="ring-center"><div class="ring-phase" id="iv-phase">${phaseLabel}</div><div class="ring-time" id="iv-time">${phase==="done"?"✓":mmss(left/1000)}</div><div class="ring-sub" id="iv-set">Round ${Math.min(T.set||1,c.sets)} of ${c.sets}</div></div></div>
      <div class="row">${ctrl}${phase && phase!=="done" ? `<button class="btn ghost" data-a="iv-reset">Reset</button>`:""}</div>
      <p class="small" style="margin-top:10px">Beeps count down the last 3 seconds of each phase. Your screen stays on while it runs.</p>
    </div>
    <div class="card">
      <p style="font-weight:600">Rounds completed</p>${stepper("a:cond.done",c.done,"rounds")}
      <div style="margin-top:14px"><select class="note" data-bind="a:cond.rpe" data-num="1" aria-label="Actual effort"><option value="">How hard was it? (RPE)</option>${Array.from({length:10},(_,k)=>`<option value="${k+1}"${c.rpe===k+1?" selected":""}>RPE ${k+1}</option>`).join("")}</select></div>
      <div class="row" style="margin-top:12px"><button class="toggle l${c.lOff?" on":""}" data-a="loff-c" aria-pressed="${!!c.lOff}">Left felt off</button><button class="toggle${c.rOff?" on":""}" data-a="roff-c" aria-pressed="${!!c.rOff}">Right felt off</button></div>
    </div>
    <button class="btn primary" data-a="finish">Finish session</button>`;
}

/* check-in */

  const id = "c-"+today();
  if(S.records[id]) S.checkin = clone(S.records[id]);
  else {
    const prev = recs(["checkin"]).pop();
    S.checkin = {id, type:"checkin", date:today(), sit:null, stand:null, walk:null,
      peak: prev ? prev.peak : 0, peakL: prev ? prev.peakL??0 : 0, back: prev ? prev.back : 0, strength: prev ? prev.strength : 10, strengthL: prev ? prev.strengthL??10 : 10,
      meds:{celecoxib:false, paracetamol:false}, homeEx:false, test:{}, flags:{}, notes:"", _fromPrev:!!prev};
  }
}

/* trends */
function dayList(n){ const out = [], d = new Date(); d.setHours(12,0,0,0); for(let k=n-1;k>=0;k--){ const x = new Date(d); x.setDate(d.getDate()-k); out.push(iso(x)); } return out; }
function lineChart(days, series, max, label, band){
  const W=340,H=160,pl=24,pr=8,pt=10,pb=22,iw=W-pl-pr,ih=H-pt-pb;
  const X = k => pl + (days.length<2 ? 0 : k*iw/(days.length-1));
  const Y = v => pt + ih - (v/max)*ih;
  let g = band ? `<rect x="${pl}" y="${Y(band[1])}" width="${iw}" height="${Y(band[0])-Y(band[1])}" style="fill:var(--danger-soft)"/><text x="${W-pr-4}" y="${Y(band[1])+11}" text-anchor="end" style="fill:var(--danger)">fatigue zone</text>` : "";
  [0,max/2,max].forEach(v=>{ g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-5}" y="${Y(v)+3}" text-anchor="end">${v}</text>`; });
  [0,Math.floor((days.length-1)/2),days.length-1].forEach((k,n)=>{ g += `<text x="${X(k)}" y="${H-6}" text-anchor="${["start","middle","end"][n]}">${esc(fmtShort(days[k]))}</text>`; });
  series.forEach(s=>{
    let d = "", pen = false;
    days.forEach((day,k)=>{ const v = s.map[day]; if(v==null){ pen = false; return; } d += (pen?"L":"M")+X(k).toFixed(1)+" "+Y(v).toFixed(1)+" "; pen = true; });
    g += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    days.forEach((day,k)=>{ const v = s.map[day]; if(v!=null) g += `<circle cx="${X(k)}" cy="${Y(v)}" r="3.5" style="fill:${s.color}"/>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>
    <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}
function barChart(items, min, max, label){
  const W=340,H=150,pl=24,pr=8,pt=10,pb=22,iw=W-pl-pr,ih=H-pt-pb;
  const Y = v => pt + ih - ((v-min)/(max-min))*ih; const zero = Y(Math.max(min,0));
  const bw = Math.min(28, iw/Math.max(items.length,1) - 4);
  let g = "";
  const ticks = min<0 ? [min,0,max] : [min,(min+max)/2,max];
  ticks.forEach(v=>{ g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-5}" y="${Y(v)+3}" text-anchor="end">${v}</text>`; });
  items.forEach((it,k)=>{
    const cx = pl + (k+0.5)*iw/items.length; const y = Y(Math.max(min,Math.min(max,it.v)));
    g += `<rect x="${(cx-bw/2).toFixed(1)}" y="${Math.min(y,zero).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,Math.abs(zero-y)).toFixed(1)}" rx="3" style="fill:${it.color}"/>`;
    if(items.length<=14 || k%2===0) g += `<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(it.l)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}
function balRow(name, L, R, unit){
  if(L==null || R==null) return "";
  const m = Math.max(L,R,1); const pct = L>0 ? Math.round(R/L*100) : null;
  return `<div class="bal"><div class="bal-name">${esc(name)}<span>${pct==null?"":`Right is ${pct}% of left`}</span></div>
    <div class="bal-bar"><b>L</b><div class="track"><div class="fill" style="width:${L/m*100}%"></div></div><span class="num">${L}${unit||""}</span></div>
    <div class="bal-bar r"><b>R</b><div class="track"><div class="fill" style="width:${R/m*100}%"></div></div><span class="num">${R}${unit||""}</span></div></div>`;
}
function viewTrends(){
  let html = `<header class="top"><div><h1>Trends</h1><p class="sub">What's changing, and what helps.</p></div></header>
    <div class="seg"><button class="${S.histTab==="trends"?"on":""}" data-a="hist" data-v="trends">Trends</button><button class="${S.histTab==="log"?"on":""}" data-a="hist" data-v="log">Log</button></div>`;
  return html + (S.histTab==="log" ? viewLog() : trendsBody() + `<button class="btn" style="margin-top:6px" data-a="claude-data">Copy my data for Claude</button>`);
}
function trendsBody(){
  const cis = recs(["checkin"]), ss = recs(["strength","conditioning"]), st = recs(["strength"]), rts = recs(["retest"]);
  if(!cis.length && !ss.length && !rts.length && !recs(["tolerance"]).length) return `<div class="empty">Log a few check-ins and sessions, and your trends show up here.</div>`;
  let html = "";
  if(rts.length){
    const last = rts[rts.length-1];
    const keys = []; rts.forEach(r=>r.rows.forEach(x=>{ const k = `${x.test} ${x.pos}`.trim(); if(x.L!=null && x.R!=null && !keys.includes(k)) keys.push(k); }));
    const pctOf = (r,k) => { const x = r.rows.find(x=>`${x.test} ${x.pos}`.trim()===k); return x && x.L && x.R!=null ? Math.round(x.R/x.L*100)+"%" : "–"; };
    html += `<div class="card"><h3>Physio strength tests</h3><p class="small">Latest from ${esc(fmtShort(last.date))}${last.units?`, in ${esc(last.units)}`:""}.</p>
      ${last.rows.map(x=>balRow(`${x.test} ${x.pos}`.trim(), x.L, x.R)).join("")}
      ${last.extDeficit!=null?`<p>Right knee short of straight: <strong style="display:inline">${last.extDeficit}°</strong></p>`:""}
      ${rts.length>1?`<p class="small" style="margin-top:10px">Right as a percentage of left over time. Closer to 100% is more even.</p><div class="tablewrap"><table class="ext"><tr><th>Date</th>${keys.map(k=>`<th class="n">${esc(k)}</th>`).join("")}<th class="n">Knee</th></tr>
        ${[...rts].reverse().map(r=>`<tr><td>${esc(fmtShort(r.date))}</td>${keys.map(k=>`<td class="n">${pctOf(r,k)}</td>`).join("")}<td class="n">${r.extDeficit!=null?r.extDeficit+"°":"–"}</td></tr>`).join("")}</table></div>`:""}
      <button class="btn" style="margin-top:12px;min-height:44px" data-a="rt-new">Add new results</button></div>`;
  }
  const days = dayList(28);
  if(cis.length){
    const hL = {}, hR = {}, sL = {}, sR = {}, diff = [];
    cis.forEach(c=>{ hR[c.date] = c.peak; sR[c.date] = c.strength; if(c.peakL!=null) hL[c.date] = c.peakL; if(c.strengthL!=null) sL[c.date] = c.strengthL;
      if(c.peakL!=null && c.peak!=null) diff.push({date:c.date, d:c.peak-c.peakL}); });
    html += `<div class="card"><h3>Leg heaviness, last 4 weeks</h3><p class="small">Worst of the day, from your evening check-ins. Lower is better. The shaded band is 7 and above.</p>
      ${lineChart(days,[{name:"Left",map:hL,color:"var(--accent)"},{name:"Right",map:hR,color:"var(--right)"}],10,"Leg heaviness, left and right, over 28 days",[7,10])}</div>
      <div class="card"><h3>Leg strength feel, last 4 weeks</h3><p class="small">Higher is better. The shaded band is 3 and below.</p>
      ${lineChart(days,[{name:"Left",map:sL,color:"var(--accent)"},{name:"Right",map:sR,color:"var(--right)"}],10,"Leg strength feel, left and right, over 28 days",[0,3])}</div>`;
    const dd = diff.slice(-14);
    if(dd.length){
      html += `<div class="card"><h3>Difference between legs</h3><p class="small">Right heaviness minus left. Above the line means the right felt heavier. Red is a gap of 3 or more.</p>
        ${barChart(dd.map(x=>({v:Math.max(-6,Math.min(6,x.d)),l:fmtShort(x.date).split(" ")[0],color:Math.abs(x.d)>=3?"var(--danger)":Math.abs(x.d)>=2?"var(--right)":"var(--accent)"})),-6,6,"Difference in heaviness between legs")}</div>`;
    }
    const sits = cis.filter(c=>c.sit!=null).slice(-14);
    if(sits.length){
      html += `<div class="card"><h3>Sitting before heaviness starts</h3><p class="small">Minutes, last ${sits.length} check-ins. A full-height bar means no heaviness from sitting.</p>
        ${barChart(sits.map(c=>({v:Math.min(c.sit,180),l:fmtShort(c.date).split(" ")[0],color:"var(--accent)"})),0,180,"Sitting tolerance")}</div>`;
    }
  }
  const mp = medPattern(cis);
  if(mp.length) html += `<div class="card"><h3>Medication and heaviness</h3><p class="small">Average scores on days you took each one versus days you didn't. This shows a pattern, not a cause: you may take medication on days that were already worse.</p>${medTable(mp)}</div>`;
  else if(cis.length) html += `<div class="card"><h3>Medication and heaviness</h3><p class="small">Shows once you have at least 3 check-ins with and 3 without each medication.</p></div>`;
  const tols = recs(["tolerance"]);
  if(tols.length){
    const bars = p => { const t = tols.filter(r=>r.pos===p).slice(-14); if(!t.length) return "";
      const mx = Math.max(30, ...t.map(r=>r.minutes)); const top = Math.ceil(mx/30)*30;
      return `<p style="font-weight:600;margin-top:10px">${p==="sit"?"Sitting":"Standing still"}${tolStats(p)?`: median ${fmtMin(tolStats(p).median)} over the last ${tolStats(p).n}`:""}</p>`
        + barChart(t.map(r=>({v:r.minutes, l:fmtShort(r.date).split(" ")[0], color:r.endedBy==="onset"?"var(--accent)":"var(--rest)"})),0,top,"Timed tolerance tests"); };
    html += `<div class="card"><h3>Timed tolerance tests</h3><p class="small">Minutes before heaviness started. Grey bars ended without heaviness, so the real figure is at least that long.</p>${bars("sit")}${bars("stand")}
      <button class="btn" style="margin-top:12px;min-height:44px" data-a="nav" data-v="tol">New test</button></div>`;
  }
  const eff = ss.filter(r=>r.pre && r.post).slice(-12);
  if(eff.length){
    const effBars = k => barChart(eff.map(r=>{ const d = (r.post[k]??0) - (r.pre[k]??0); return {v:d,l:fmtShort(r.date).split(" ")[0],color:d>0?"var(--danger)":"var(--accent)"}; }),-5,5,"Session effect on heaviness");
    const hasL = eff.some(r=>r.pre.heavyL!=null);
    html += `<div class="card"><h3>How sessions change leg heaviness</h3><p class="small">After minus before. Below the line means you felt lighter afterwards.</p>
      ${hasL?`<p style="font-weight:600;margin-top:8px">Left</p>${effBars("heavyL")}<p style="font-weight:600;margin-top:8px">Right</p>`:""}${effBars("heavy")}</div>`;
  }
  // left / right
  let bal = "";
  const lastTest = [...cis].reverse().find(c=>c.test && Object.values(c.test).some(v=>v!=null));
  if(lastTest){
    const t = lastTest.test;
    bal += balRow("Single-leg sit to stand",t.stsL,t.stsR) + balRow("Single-leg bridge",t.brL,t.brR) + balRow("Single-leg calf raise",t.calfL,t.calfR) + balRow("Toe raise",t.toeL,t.toeR) + balRow("Physio hamstring force",t.hamL,t.hamR);
  }
  const lastSt = st[st.length-1];
  if(lastSt){
    lastSt.ex.filter(e=>e.sided && e.kind==="reps").forEach(e=>{
      const done = e.log.filter(s=>s.done); if(!done.length) return;
      bal += balRow(e.name+" (reps, last session)", done.reduce((a,s)=>a+(s.repsL||0),0), done.reduce((a,s)=>a+(s.repsR||0),0));
    });
    lastSt.ex.filter(e=>e.sided && e.kind==="time").forEach(e=>{
      const sL = e.log.map(s=>s.secsL).filter(v=>v!=null), sR = e.log.map(s=>s.secsR).filter(v=>v!=null);
      if(sL.length && sR.length) bal += balRow(e.name+" (best hold, last session)", Math.max(...sL), Math.max(...sR), " s");
    });
  }
  if(bal) html += `<div class="card"><h3>Left and right</h3>${lastTest?`<p class="small">Self-test from ${esc(fmtShort(lastTest.date))}.</p>`:""}${bal}</div>`;
  // exercise table
  if(st.length){
    const agg = {};
    st.forEach(r=>r.ex.forEach(e=>{
      if(!e.log.some(s=>s.done)) return;
      const a = agg[e.pid] || (agg[e.pid] = {name:e.name, n:0, off:0, loff:0, rpe:[]});
      a.n++; if(e.rOff) a.off++; if(e.lOff) a.loff++; if(e.rpe) a.rpe.push(e.rpe);
    }));

/* ---------- program versions and changes ---------- */
const BLOCKN = {warmup:"Warm-up", gym:"Gym", conditioning:"Conditioning", all:"Program"};
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const BOOLF = {sided:1, weight:1, paused:1};
const EXF = [["sets","Sets"],["target","Target"],["kind","Type"],["reps","Reps"],["secs","Hold"],["rpe","RPE"],["kg","Weight"],["notes","Notes"],["sided","Each side"],["weight","Log weight"],["paused","Paused"]];
const CONDF = [["erg","Machine"],["work","Work"],["rest","Easy"],["sets","Rounds"],["rpe","RPE"]];
function fmtVal(k,v){
  if(BOOLF[k]) return v ? "yes" : "no";
  if(v==null || v==="") return "none";
  if(k==="secs") return v+" s"; if(k==="kg") return v+" kg";
  if(k==="work" || k==="rest") return mmss(v);
  if(k==="kind") return {reps:"reps", time:"timed hold", distance:"distance"}[v] || v;
  return String(v);
}
function fieldDiff(a,b,fields){
  const out = [];
  fields.forEach(([k,l])=>{
    const same = BOOLF[k] ? !!a[k]===!!b[k] : looseText(a[k])===looseText(b[k]);
    if(!same) out.push(`${l} ${fmtVal(k,a[k])} to ${fmtVal(k,b[k])}`);
  });
  return out;
}
const looseText = v => String(v??"").toLowerCase().replace(/[\u2012-\u2015-]/g,"-").replace(/\s*-\s*/g,"-").replace(/\bseconds?\b|\bsecs?\b/g,"s").replace(/\s+/g," ").trim();
const condName = c => `Session ${c.id}: ${c.erg}`;
function progDiff(o,n){
  const out = [];
  ["warmup","gym"].forEach(b=>{
    const om = new Map(o[b].map(x=>[norm(x.name),x])), seen = new Set();
    n[b].forEach(x=>{
      const k = norm(x.name), m = om.get(k);
      if(!m) out.push({kind:"add", block:b, name:x.name, details:[`${x.sets} × ${x.target}`]});
      else { seen.add(k); const d = fieldDiff(m,x,EXF); if(d.length) out.push({kind:"change", block:b, name:x.name, details:d}); }
    });
    o[b].forEach(x=>{ if(!seen.has(norm(x.name))) out.push({kind:"remove", block:b, name:x.name}); });
  });
  const om = new Map(o.conditioning.map(x=>[norm(x.id),x])), seen = new Set();
  n.conditioning.forEach(x=>{
    const k = norm(x.id), m = om.get(k);
    if(!m) out.push({kind:"add", block:"conditioning", name:condName(x)});
    else { seen.add(k); const d = fieldDiff(m,x,CONDF); if(d.length) out.push({kind:"change", block:"conditioning", name:condName(x), details:d}); }
  });
  o.conditioning.forEach(x=>{ if(!seen.has(norm(x.id))) out.push({kind:"remove", block:"conditioning", name:condName(x)}); });
  return out;
}
function chgRow(c, noBlock){
  const verb = {add:"Added", remove:"Removed", change:"Changed", move:"Moved"}[c.kind] || "Changed";
  const cls = c.kind==="add" ? "add" : c.kind==="remove" ? "remove" : "change";
  return `<div class="chg ${cls}"><strong>${verb} ${esc(c.name)}</strong><span>${esc([noBlock?"":BLOCKN[c.block]||"", ...(c.details||[])].filter(Boolean).join(". "))}</span></div>`;

/* ---------- reading Claude's codes ---------- */
const numOr = (v,lo,hi) => { const n = Number(v); return v==null || v==="" || !isFinite(n) ? null : Math.max(lo,Math.min(hi,Math.round(n*2)/2)); };
let idSeq = 0;
function sanExField(k,v){
  switch(k){
    case "name": return String(v||"").trim().slice(0,80) || undefined;
    case "sets": return numOr(v,1,20) || undefined;
    case "target": return String(v||"").trim().slice(0,60) || undefined;
    case "kind": return ["reps","time","distance"].includes(v) ? v : undefined;
    case "reps": return numOr(v,1,100);
    case "secs": return numOr(v,1,600);
    case "rpe": return numOr(v,1,10);
    case "notes": return String(v??"").trim().slice(0,160);
    case "sided": case "weight": return !!v;
    case "kg": return numOr(v,0,500);
    case "erg": return String(v||"").trim().slice(0,30) || undefined;
    case "id": return String(v||"").trim().slice(0,12) || undefined;
    case "work": return numOr(v,5,3600) || undefined;
    case "rest": return numOr(v,0,3600) ?? undefined;
  }
  return undefined;
}
function applyOps(o){
  if(!o || typeof o!=="object" || !Array.isArray(o.ops)) return null;
  const np = clone(S.settings.program), unclear = Array.isArray(o.unclear) ? o.unclear.filter(Boolean).map(String).slice(0,10) : [];
  const blocks = ["warmup","gym","conditioning"];
  const keyOf = (b,x) => b==="conditioning" ? x.id : x.name;
  const find = (b,name) => { const order = blocks.includes(b) ? [b, ...blocks.filter(x=>x!==b)] : blocks;
    for(const bb of order){ const k = np[bb].findIndex(x=>norm(keyOf(bb,x))===norm(name)); if(k>=0) return [bb,k]; } return null; };
  o.ops.slice(0,30).forEach(op=>{
    if(!op || typeof op!=="object") return;
    if(op.op==="update" || op.op==="remove"){
      const hit = find(op.block, op.name);
      if(!hit){ unclear.push(`Couldn't find "${op.name}" in your program`); return; }
      const [b,k] = hit;
      if(op.op==="remove"){ np[b].splice(k,1); return; }
      const it = np[b][k], set = op.set && typeof op.set==="object" ? op.set : {};
      Object.keys(set).forEach(f=>{ if(!(b==="conditioning" ? ["id","erg","work","rest","sets","rpe"] : ["name","sets","target","kind","reps","secs","rpe","notes","sided","weight","kg"]).includes(f)) return;
        const v = sanExField(f,set[f]); if(v!==undefined) it[f] = v; });
      if(it.kind==="time" && !it.secs) it.secs = 30; if(it.kind==="reps" && !it.reps) it.reps = 10;
    } else if(op.op==="add"){
      const b = blocks.includes(op.block) ? op.block : "gym";
      const one = sanitizeImport(b==="conditioning" ? {conditioning:[op.exercise]} : {[b]:[op.exercise]});
      const item = one && one[b] && one[b][0]; if(!item){ unclear.push("An added exercise couldn't be read"); return; }
      const after = op.after ? np[b].findIndex(x=>norm(keyOf(b,x))===norm(op.after)) : -1;
      if(after>=0) np[b].splice(after+1,0,item); else np[b].push(item);
    }
  });
  return {np, unclear, title:String(o.title||"").slice(0,60)};
}
function sanitizeImport(o){
  if(!o || typeof o!=="object" || Array.isArray(o)) return null;
  const ex = a => !Array.isArray(a) ? null : a.filter(x=>x && x.name).slice(0,30).map(x=>{
    const kind = ["reps","time","distance"].includes(x.kind) ? x.kind : "reps";
    const e = {id:"x"+Date.now().toString(36)+(idSeq++), name:String(x.name).trim().slice(0,80), sets:numOr(x.sets,1,20)||2,
      target:String(x.target||"").trim().slice(0,60), kind, rpe:numOr(x.rpe,1,10), notes:String(x.notes||"").trim().slice(0,160),
      sided:!!x.sided, weight:!!x.weight, kg:numOr(x.kg,0,500)};
    if(kind==="reps") e.reps = numOr(x.reps,1,100) || 10;
    if(kind==="time") e.secs = numOr(x.secs,1,600) || 30;
    if(!e.target) e.target = kind==="reps" ? `${e.reps} reps` : kind==="time" ? `${e.secs} s` : "as set";
    return e;
  });
  const cond = a => !Array.isArray(a) ? null : a.filter(x=>x && (x.id || x.erg)).slice(0,15).map((x,k)=>({
    id:String(x.id||String.fromCharCode(65+k)).trim().slice(0,12), erg:String(x.erg||"Erg").trim().slice(0,30),
    work:numOr(x.work,5,3600)||30, rest:numOr(x.rest,0,3600)??30, sets:numOr(x.sets,1,50)||4, rpe:numOr(x.rpe,1,10)||5}));
  return {title:String(o.title||"").slice(0,60), warmup:ex(o.warmup), gym:ex(o.gym), conditioning:cond(o.conditioning),
    unclear:Array.isArray(o.unclear) ? o.unclear.filter(Boolean).map(String).slice(0,10) : []};
}
function matchExisting(list, old){
  const all = [...old.warmup, ...old.gym];
  return list.map(x=>{ const m = all.find(o=>norm(o.name)===norm(x.name)); if(m){ x.id = m.id; if(m.weight) x.weight = true; if(looseText(m.target)===looseText(x.target)) x.target = m.target; } return x; });
}
function sanitizeCue(o){
  if(!o || typeof o!=="object") return null;
  const arr = a => Array.isArray(a) ? a.filter(x=>typeof x==="string" && x.trim()).map(x=>x.trim().slice(0,200)).slice(0,6) : [];
  const c = {what:String(o.what||"").slice(0,300), setup:arr(o.setup), move:arr(o.move), cues:arr(o.cues), mistakes:arr(o.mistakes), search:String(o.search||"").slice(0,100)};
  return c.move.length || c.cues.length ? c : null;
}
const ytUrl = q => "https://www.youtube.com/results?search_query="+encodeURIComponent(q);

/* ---------- paste from Claude ---------- */
function findJson(text){
  const t = String(text||"");
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  const body = fence ? fence[1] : t;
  const a = body.indexOf("{"), b = body.lastIndexOf("}");
  if(a<0 || b<=a) return null;
  try{ return JSON.parse(body.slice(a,b+1)); }catch(e){ return null; }
}
function parseCode(text){
  const o = findJson(text);
  if(!o || typeof o!=="object") return {error:"That doesn't look like a code from Claude. Copy Claude's whole reply, or just the part between the code markers, and paste it again."};
  const old = S.settings.program;
  let np = clone(old), unclear = [], kept = [], label = String(o.title||"").slice(0,60), scope = "changes";
  if(Array.isArray(o.ops)){
    const r = applyOps(o); if(!r) return {error:"The changes in that code couldn't be read."};
    np = r.np; unclear = r.unclear;
  } else if(o.warmup || o.gym || o.conditioning){
    const r = sanitizeImport(o); if(!r) return {error:"The program in that code couldn't be read."};
    np = {warmup:r.warmup?matchExisting(r.warmup,old):clone(old.warmup), gym:r.gym?matchExisting(r.gym,old):clone(old.gym), conditioning:r.conditioning||clone(old.conditioning)};
    unclear = r.unclear; kept = ["warmup","gym","conditioning"].filter(b=>!r[b]); scope = "full";
  } else if(Array.isArray(o.unclear)) unclear = o.unclear.filter(Boolean).map(String).slice(0,10);
  const cues = [];
  if(o.cues && typeof o.cues==="object") Object.entries(o.cues).slice(0,20).forEach(([name,c])=>{ const card = sanitizeCue(c); if(card) cues.push({name:String(name).slice(0,80), card}); });
  const changes = progDiff(old,np);
  if(!changes.length && !cues.length) return {error: unclear.length ? "Nothing to change. Claude noted: "+unclear.join(" ") : "That code doesn't contain any changes."};
  return {result:{np, changes, unclear, kept, cues}, label: label || (changes.length ? (scope==="full"?"Physio plan":"Physio changes") : "Cue cards"), scope};
}

function claudeData(){

  const sLine = r => { const offs = (r.ex||[]).filter(e=>e.lOff||e.rOff).map(e=>`${e.name} (${[e.lOff?"L":"",e.rOff?"R":""].filter(Boolean).join("+")} off)`);

function blockCard(blk){
  const list = S.settings.program[blk], E = S.edit, isC = blk==="conditioning";
  const rows = list.map((p,k)=>{
    if(E && E.blk===blk && E.k===k) return exEditor();
    const title = isC ? condName(p) : p.name;
    const sub = isC ? `${p.sets} rounds of ${mmss(p.work)} work, ${mmss(p.rest)} easy. RPE ${p.rpe}` : `${p.sets} × ${esc(p.target)}${p.rpe?`, RPE ${p.rpe}`:""}${p.notes?`. ${esc(p.notes)}`:""}`;
    const at = `data-blk="${blk}" data-k="${k}"`;
    return `<div class="pe${p.paused?" paused":""}"><h3>${esc(title)}${p.paused?`<span class="badge">Paused</span>`:""}</h3><p class="target">${sub}</p>
      <div class="pe-tools"><button class="mini" data-a="pe-move" data-d="-1" ${at}${k===0?" disabled":""} aria-label="Move ${esc(title)} up">↑</button><button class="mini" data-a="pe-move" data-d="1" ${at}${k===list.length-1?" disabled":""} aria-label="Move ${esc(title)} down">↓</button>
      <button class="mini" data-a="pe-edit" ${at}>Edit</button>${isC?"":`<button class="mini" data-a="pe-pause" ${at}>${p.paused?"Resume":"Pause"}</button><button class="mini" data-a="guide" data-src="p" ${at}>Form guide</button>`}</div></div>`;
  }).join("");
  const adding = E && E.blk===blk && E.k<0;
  return `<details class="card" data-ob="${blk}"${adding || (E && E.blk===blk) || S.ob[blk] ? " open":""}><summary>${BLOCKN[blk]} <span class="small" style="margin-left:auto;margin-right:12px">${list.length}</span></summary>${rows}
    ${adding ? exEditor() : `<button class="btn" style="margin-top:12px" data-a="pe-add" data-blk="${blk}">Add ${isC?"conditioning session":(blk==="warmup"?"warm-up exercise":"gym exercise")}</button>`}</details>`;
}

  }

  return html;
}
