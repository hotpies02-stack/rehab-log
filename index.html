function tolStart(pos){
  S.tol = {id:"tt-"+uid(), pos, startedAt:Date.now(), ctx:null};
  store("rl.tol.v1",S.tol); S.tolQ = 0; keepAwake(true); go("tol");
}
function tolEnd(how){
  const t = S.tol; if(!t) return;
  const mins = Math.round((Date.now()-t.startedAt)/600)/100;
  const last = lastSymptoms();
  S.tolDraft = {id:t.id, type:"tolerance", date:iso(new Date(t.startedAt)), pos:t.pos, startedAt:t.startedAt, endedAt:Date.now(),
    minutes:Math.round(mins*10)/10, endedBy:how, ctx:t.ctx, heavyL:last.heavyL??0, heavyR:last.heavy??0, note:""};
  S.tol = null; store("rl.tol.v1",null); keepAwake(false); render(false); window.scrollTo(0,0);
}
const tolLabel = r => r.endedBy==="onset" ? `${fmtMin(r.minutes)} before heaviness` : r.endedBy==="none" ? `${fmtMin(r.minutes)}, no heaviness` : `${fmtMin(r.minutes)}, stopped early`;
function fmtMin(m){ m = Math.round(m); return m<60 ? `${m} min` : `${Math.floor(m/60)} h${m%60?` ${m%60} min`:""}`; }
function viewTol(){
  const t = S.tol, d = S.tolDraft;
  if(d){
    const ctxList = TOL_CTX[d.pos];
    return `<header class="top"><div><h1>${d.pos==="sit"?"Sitting":"Standing"} test done</h1><p class="sub">${esc(tolLabel(d))}</p></div></header>
      <div class="card">${legPair("Leg heaviness now","w:heavyL","w:heavyR",d.heavyL,d.heavyR,"None","Worst",false)}
      <div class="q"><p>${d.pos==="sit"?"What were you sitting on?":"Where were you?"}</p>${pick("w:ctx",ctxList,d.ctx)}</div>
      <label class="field"><span>Notes</span><textarea class="note" data-bind="w:note" placeholder="Where you felt it, what you were doing">${esc(d.note)}</textarea></label></div>
      <button class="btn primary" data-a="tol-save">Save test</button><button class="btn ghost" data-a="tol-discard">Discard</button>`;
  }
  if(t){
    const el = (Date.now()-t.startedAt)/1000;
    return `<header class="top"><div><h1>${t.pos==="sit"?"Sitting":"Standing still"}</h1><p class="sub">Tap the button as soon as heaviness starts. Don't push through it.</p></div></header>
      <div class="card"><div class="ringwrap"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-bg" cx="100" cy="100" r="88"/><circle id="tol-ring" class="ring-fg" cx="100" cy="100" r="88" style="stroke-dashoffset:${(552.9*(1-((el/60)%15)/15)).toFixed(1)}"/></svg>
        <div class="ring-center"><div class="ring-phase">Elapsed</div><div class="ring-time" id="tol-time" style="${el>=3600?"font-size:2.8rem":""}">${hmmss(el)}</div><div class="ring-sub">${esc(tolHint(t.pos))}</div></div></div>
        <button class="btn primary" data-a="tol-onset">Heaviness started</button>
        <div class="row" style="margin-top:10px"><button class="btn" data-a="tol-none">Stop, no heaviness</button><button class="btn ghost" data-a="tol-stop">Stopped for another reason</button></div>
        <p class="small" style="margin-top:12px">The timer keeps going if you leave the app or lock your phone. A soft chime marks every 15 minutes.</p></div>`;
  }
  const tests = recs(["tolerance"]);
  const recent = p => tests.filter(r=>r.pos===p).slice(-5);
  const sumLine = p => { const s = tolStats(p); return s ? `Last ${s.n}: median ${fmtMin(s.median)}${s.lower?`, ${s.lower} without heaviness`:""}` : "No tests yet"; };
  return backBtn("Today") + `<header class="top"><div><h1>Tolerance test</h1><p class="sub">Time how long you can sit or stand before heaviness starts. More accurate than guessing at the end of the day.</p></div></header>
    <button class="action main" data-a="tol-start" data-v="sit"><strong>Start sitting test</strong><span>${esc(sumLine("sit"))}</span></button>
    <button class="action" data-a="tol-start" data-v="stand"><strong>Start standing test</strong><span>${esc(sumLine("stand"))}</span></button>
    <div class="card"><h3>Getting useful numbers</h3><p class="small" style="margin-top:6px">Start when you sit or stand, and stop the moment heaviness starts. Use the same kind of chair each time where you can. A few tests a week is plenty.</p></div>
    ${tests.length?`<div class="card"><h3>Recent tests</h3>${[...tests].reverse().slice(0,8).map(r=>`<p>${esc(fmtShort(r.date))}: ${r.pos==="sit"?"sitting":"standing"}, ${esc(tolLabel(r))}${r.ctx?` (${esc(r.ctx.toLowerCase())})`:""}</p>`).join("")}</div>`:""}`;
}
function tolHint(pos){ return pos==="sit" ? "Sit as usual" : "Stand still"; }
const hmmss = sec => sec>=3600 ? `${Math.floor(sec/3600)}:${pad(Math.floor(sec%3600/60))}:${pad(Math.floor(sec%60))}` : mmss(sec);
function tolStats(pos, from){
  const t = recs(["tolerance"]).filter(r=>r.pos===pos && (!from || r.date>=from) && r.endedBy!=="stopped").slice(from?0:-5);
  if(!t.length) return null;
  const v = t.map(r=>r.minutes).sort((a,b)=>a-b), m = v.length%2 ? v[(v.length-1)/2] : (v[v.length/2-1]+v[v.length/2])/2;
  return {n:t.length, median:m, min:v[0], max:v[v.length-1], lower:t.filter(r=>r.endedBy==="none").length};
}
function tolTick(){
  const t = S.tol; if(!t || S.view!=="tol" || S.tolDraft) return;
  const el = (Date.now()-t.startedAt)/1000, e = document.getElementById("tol-time"); if(e){ e.textContent = hmmss(el); if(el>=3600) e.style.fontSize = "2.8rem"; }
  const ring = document.getElementById("tol-ring"); if(ring) ring.style.strokeDashoffset = (552.9*(1-((el/60)%15)/15)).toFixed(1);
  const q = Math.floor(el/900); if(q>0 && q!==S.tolQ){ S.tolQ = q; beep(660,.25); buzz(120); }
}

/* ---------- clinic report ---------- */
const REP_RANGE = [{v:14,l:"2 weeks"},{v:28,l:"4 weeks"},{v:56,l:"8 weeks"}];
function avg(a){ const v = a.filter(x=>typeof x==="number"); return v.length ? v.reduce((x,y)=>x+y,0)/v.length : null; }
const f1 = v => v==null ? "–" : (Math.round(v*10)/10).toString();
function reportData(days){
  const end = today(), dl = dayList(days), from = dl[0];
  const inR = r => r.date>=from && r.date<=end;
  const cis = recs(["checkin"]).filter(inR), ss = recs(["strength","conditioning"]).filter(inR);
  const half = dl[Math.floor(dl.length/2)];
  const early = cis.filter(c=>c.date<half), late = cis.filter(c=>c.date>=half);
  const fz = (k,inv) => cis.filter(c=>typeof c[k]==="number" && (inv ? c[k]<=3 : c[k]>=7)).length;
  return {from, end, dl, cis, ss, early, late, fz,
    st:ss.filter(r=>r.type==="strength"), cond:ss.filter(r=>r.type==="conditioning"),
    tests:recs(["retest"]), symptoms:recs(["symptom"]).filter(inR), tols:recs(["tolerance"]).filter(inR),
    flags:cis.filter(c=>c.flags && Object.values(c.flags).some(Boolean)),
    versions:versionsList().filter(v=>v.date && v.date>=from && v.source!=="start"),
    questions:recs(["question"]).filter(q=>!q.answered)};
}
function reportBody(days, who){
  const D = reportData(days), P = S.settings;
  const row = (label, l, r, note) => `<tr><td>${label}</td><td class="n">${l}</td><td class="n">${r}</td>${note!==undefined?`<td>${note}</td>`:""}</tr>`;
  const trend = (k) => { const a = avg(D.early.map(c=>c[k])), b = avg(D.late.map(c=>c[k])); return a==null||b==null ? f1(avg(D.cis.map(c=>c[k]))) : `${f1(a)} → ${f1(b)}`; };
  let h = `<div class="rep-head"><h1>Rehab log summary</h1><p>${P.name?esc(P.name)+". ":""}${esc(fmtShort(D.from))} to ${esc(fmtShort(D.end))} ${parseD(D.end).getFullYear()}. Prepared ${esc(fmtLong(today()))}${who&&who!=="Anyone"?` for ${who==="GP"?"GP":who.toLowerCase()} review`:""}.</p>
    <p class="rep-src">Self-recorded in a personal log: ${D.cis.length} evening check-ins, ${D.st.length} strength and ${D.cond.length} conditioning sessions, ${D.tols.length} timed tolerance test${D.tols.length===1?"":"s"}.</p></div>`;
  h += `<section><h2>Warning signs</h2><p class="${D.flags.length?"rep-bad":""}">${D.flags.length?`Ticked on ${D.flags.map(c=>esc(fmtShort(c.date))+": "+Object.entries(c.flags).filter(x=>x[1]).map(x=>esc(FLAGS[x[0]].toLowerCase())).join(", ")).join("; ")}.`:"None ticked in this period."}</p></section>`;
  if(D.cis.length){
    h += `<section><h2>Legs, from evening check-ins</h2><p class="rep-note">Scores out of 10. Where there's enough data, shown as the first half of the period to the second half.</p>
      <table class="ext"><tr><th></th><th class="n">Left</th><th class="n">Right</th></tr>
      ${row("Worst heaviness (lower is better)", trend("peakL"), trend("peak"))}
      ${row("Strength feel (higher is better)", trend("strengthL"), trend("strength"))}
      ${row("Days heaviness 7 or more", D.fz("peakL"), D.fz("peak"))}
      ${row("Days strength 3 or less", D.fz("strengthL",true), D.fz("strength",true))}</table>
      ${lineChart(D.dl,[{name:"Left heaviness",map:Object.fromEntries(D.cis.filter(c=>c.peakL!=null).map(c=>[c.date,c.peakL])),color:"var(--accent)"},{name:"Right heaviness",map:Object.fromEntries(D.cis.map(c=>[c.date,c.peak])),color:"var(--right)"}],10,"Leg heaviness",[7,10])}
      ${lineChart(D.dl,[{name:"Left strength",map:Object.fromEntries(D.cis.filter(c=>c.strengthL!=null).map(c=>[c.date,c.strengthL])),color:"var(--accent)"},{name:"Right strength",map:Object.fromEntries(D.cis.map(c=>[c.date,c.strength])),color:"var(--right)"}],10,"Leg strength feel",[0,3])}</section>`;
  }
  const sitT = tolStats("sit",D.from), stT = tolStats("stand",D.from);
  const modeOf = (k,list) => { const c = {}; D.cis.forEach(x=>{ if(x[k]!=null) c[x[k]] = (c[x[k]]||0)+1; }); const top = Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; return top ? labelOf(list,Number(top[0])) : "–"; };
  const tolCell = t => !t ? "None" : t.n===1 ? `${fmtMin(t.median)} (1 test${t.lower?", ended without heaviness":""})` : `Median ${fmtMin(t.median)}, range ${fmtMin(t.min)} to ${fmtMin(t.max)} (${t.n} tests${t.lower?`, ${t.lower} ended without heaviness`:""})`;
  h += `<section><h2>Sitting and standing tolerance</h2><table class="ext"><tr><th></th><th>Timed tests</th><th>Usual end-of-day estimate</th></tr>
    <tr><td>Sitting before heaviness</td><td>${tolCell(sitT)}</td><td>${esc(modeOf("sit",SIT))}</td></tr>
    <tr><td>Standing still before heaviness</td><td>${tolCell(stT)}</td><td>${esc(modeOf("stand",STAND))}</td></tr>
    <tr><td>Walking per day</td><td></td><td>${esc(modeOf("walk",WALK))}</td></tr></table></section>`;
  if(D.tests.length){
    const last = D.tests[D.tests.length-1], prev = D.tests.length>1 ? D.tests[D.tests.length-2] : null;
    const pct = x => x && x.L ? Math.round(x.R/x.L*100)+"%" : "–";
    h += `<section><h2>Physio measurements</h2><p class="rep-note">Latest ${esc(fmtShort(last.date))}${prev?`, compared with ${esc(fmtShort(prev.date))}`:""}${last.units?`. Units: ${esc(last.units)}`:". Units not recorded"}.</p>
      <table class="ext"><tr><th>Test</th><th class="n">Left</th><th class="n">Right</th><th class="n">R as % of L</th>${prev?`<th class="n">Before</th>`:""}</tr>
      ${last.rows.map(x=>{ const p = prev && prev.rows.find(y=>`${y.test} ${y.pos}`===`${x.test} ${x.pos}`); return `<tr><td>${esc(x.test)} ${esc(x.pos)}</td><td class="n">${x.L??"–"}</td><td class="n">${x.R??"–"}</td><td class="n">${pct(x)}</td>${prev?`<td class="n">${p?pct(p):"–"}</td>`:""}</tr>`; }).join("")}
      ${last.extDeficit!=null?`<tr><td>Right knee short of straight</td><td colspan="${prev?4:3}">${last.extDeficit}°${prev&&prev.extDeficit!=null?` (before: ${prev.extDeficit}°)`:""}</td></tr>`:""}</table>
      ${last.notes?`<p class="rep-note">${esc(last.notes)}</p>`:""}</section>`;
  }
  if(D.ss.length){
    const eff = D.ss.filter(r=>r.pre&&r.post), dR = avg(eff.map(r=>r.post.heavy-r.pre.heavy)), dL = avg(eff.filter(r=>r.pre.heavyL!=null).map(r=>(r.post.heavyL??0)-r.pre.heavyL));
    const offs = {}; D.st.forEach(r=>r.ex.forEach(e=>{ if(e.lOff||e.rOff){ const o = offs[e.name] || (offs[e.name] = {l:0,r:0}); if(e.lOff) o.l++; if(e.rOff) o.r++; } }));
    const offList = Object.entries(offs).sort((a,b)=>(b[1].r+b[1].l)-(a[1].r+a[1].l)).slice(0,5);
    h += `<section><h2>Exercise</h2><p>${D.st.length} strength and ${D.cond.length} conditioning sessions, ${f1(D.ss.length/(days/7))} a week.${eff.length?` Average change in heaviness from before to after a session: left ${dL==null?"–":(dL>0?"+":"")+f1(dL)}, right ${(dR>0?"+":"")+f1(dR)}.`:""}</p>
      ${offList.length?`<p>Exercises where a leg felt off: ${offList.map(([n,o])=>`${esc(n)} (${[o.l?`left ${o.l}`:"",o.r?`right ${o.r}`:""].filter(Boolean).join(", ")})`).join("; ")}.</p>`:""}</section>`;
  }
  if(D.symptoms.length) h += `<section><h2>Symptom changes logged</h2>${D.symptoms.map(y=>`<p>${esc(fmtShort(y.date))}${y.time?` ${esc(y.time)}`:""}: ${esc((y.what||[]).join(", ").toLowerCase())}${y.doing&&y.doing.length?`, while ${esc(y.doing.join(", ").toLowerCase())}`:""}${y.lasted?`, lasted ${esc(y.lasted.toLowerCase())}`:""}.${y.note?` ${esc(y.note)}`:""}</p>`).join("")}</section>`;
  if(D.cis.length){
    const cel = D.cis.filter(c=>c.meds&&c.meds.celecoxib).length, par = D.cis.filter(c=>c.meds&&c.meds.paracetamol).length, hx = D.cis.filter(c=>c.homeEx).length;
    h += `<section><h2>Medication and home exercise</h2><p>Out of ${D.cis.length} check-ins: celecoxib on ${cel} days, paracetamol on ${par}, home physio exercises on ${hx}.</p></section>`;
  }
  const fl = recs(["flight"]).filter(r=>r.date>=D.from);
  if(fl.length) h += `<section><h2>Flights</h2>${fl.map(r=>`<p>${esc(fmtShort(r.date))}: ${esc(flightSummary(r))}</p>`).join("")}</section>`;
  const mp = medPattern(D.cis);
  if(mp.length) h += `<section><h2>Medication and heaviness</h2><p class="rep-note">Average scores on days taken versus not. A pattern only: days with medication may have been worse to begin with.</p>${medTable(mp)}</section>`;
  const stLast = [...D.cis].reverse().find(c=>c.test && ["stsL","brL","calfL","toeL"].some(k=>c.test[k]!=null));
  if(stLast){ const t = stLast.test, pr = (n,l,r) => l==null||r==null ? "" : `<tr><td>${n}</td><td class="n">${l}</td><td class="n">${r}</td><td class="n">${l?Math.round(r/l*100)+"%":"–"}</td></tr>`;
    h += `<section><h2>Self-tests</h2><p class="rep-note">Latest ${esc(fmtShort(stLast.date))}, reps.</p><table class="ext"><tr><th>Test</th><th class="n">Left</th><th class="n">Right</th><th class="n">R as % of L</th></tr>
      ${pr("Single-leg sit to stand (30 s)",t.stsL,t.stsR)}${pr("Single-leg bridge",t.brL,t.brR)}${pr("Single-leg calf raise",t.calfL,t.calfR)}${pr("Toe raise, heels down",t.toeL,t.toeR)}</table></section>`; }
  if(D.versions.length) h += `<section><h2>Program changes</h2>${D.versions.map(v=>`<p>${esc(versionLabel(v))}: ${esc(v.changes.slice(0,6).map(c=>({add:"added ",remove:"removed ",move:"moved "}[c.kind]||"changed ")+c.name+(c.details&&c.details.length&&c.kind==="change"?` (${c.details.slice(0,2).join(", ")})`:"")).join("; "))}${v.changes.length>6?"…":""}</p>`).join("")}</section>`;
  const qs = D.questions.filter(q=>!who || who==="Anyone" || q.who===who || q.who==="Anyone");
  if(qs.length) h += `<section><h2>Questions</h2><ol>${qs.map(q=>`<li>${esc(q.text)}</li>`).join("")}</ol></section>`;
  h += `<p class="rep-foot">Recorded by the patient in a personal app. Scores are self-rated and not a clinical assessment.</p>`;
  return h;
}

/* ---------- flight mode ---------- */
function flightDefault(){
  const t = tolStats("sit");
  if(!t) return {mins:45, why:"No timed sitting tests yet, so this starts at 45 minutes."};
  const m = Math.max(20, Math.min(60, Math.floor(t.median*0.66/5)*5));
  return {mins:m, why:`About two-thirds of your median sitting time of ${fmtMin(t.median)}, so you move before heaviness usually starts.`};
}
function saveFlight(){ store("rl.flight.v1", S.flight); }
function flightNew(){
  const d = flightDefault(), last = lastSymptoms();
  S.flight = {id:"f-"+uid(), stage:"setup", interval:d.mins, awake:true, pre:{heavyL:last.heavyL??0, heavyR:last.heavy??0}, breaks:[], snoozes:0, note:""};
  saveFlight(); go("flight");
}
function flightStart(){
  const F = S.flight; F.stage = "run"; F.startedAt = Date.now(); F.nextAt = Date.now()+F.interval*60000; F.paused = false;
  saveFlight(); unlockAudio(); if(F.awake) keepAwake(true); render(false); window.scrollTo(0,0);
}
function flightAlert(){ beep(880,.3); setTimeout(()=>beep(1175,.4),350); buzz([400,150,400,150,400]); }
function flightTick(){
  const F = S.flight; if(!F || F.paused) return;
  const now = Date.now();
  if(F.stage==="run" && now>=F.nextAt){
    const last = lastBreakRating();
    F.stage = "break"; F.dueAt = F.nextAt; F.alerts = 1; F.bk = {heavyL:last.heavyL, heavyR:last.heavyR};
    saveFlight(); flightAlert(); if(S.view==="flight") render(false); else toast("Flight Mode: time to move");
    return;
  }
  if(F.stage==="break" && F.alerts<3 && now-F.dueAt >= F.alerts*60000){ F.alerts++; saveFlight(); flightAlert(); }
  if(S.view==="flight" && F.stage==="run"){
    const left = (F.nextAt-now)/1000, el = document.getElementById("fl-time"); if(el) el.textContent = hmmss(left);
    const ring = document.getElementById("fl-ring"); if(ring) ring.style.strokeDashoffset = (552.9*(1-Math.max(0,Math.min(1,left/(F.interval*60))))).toFixed(1);
    const tot = document.getElementById("fl-total"); if(tot) tot.textContent = fmtMin((now-F.startedAt)/60000);
  }
}
function lastBreakRating(){
  const F = S.flight, b = [...F.breaks].reverse().find(x=>!x.skipped);
  return b ? {heavyL:b.heavyL, heavyR:b.heavyR} : {heavyL:F.pre.heavyL, heavyR:F.pre.heavyR};
}
function movesHtml(){
  const mv = S.settings.flightMoves || [];
  return mv.length ? `<ol style="padding-left:22px;margin:6px 0">${mv.map(m=>`<li>${esc(m)}</li>`).join("")}</ol>`
    : `<p class="small">No moves from your physio yet. Stand up and walk the aisle if you can.</p>`;
}
function viewFlight(){
  const F = S.flight;
  if(!F) return backBtn("Today") + `<header class="top"><div><h1>Flight Mode</h1><p class="sub">Movement breaks for a long flight, timed from your own sitting tests.</p></div></header>
    <button class="action main" data-a="fl-new"><strong>Set up a flight</strong><span>${esc(flightDefault().why)}</span></button>
    ${movesCard()}`;
  if(F.stage==="setup"){
    const d = flightDefault(), opts = [30,40,45,50,60,75].map(v=>({v,l:`${v} min`}));
    if(!opts.some(o=>o.v===d.mins)) opts.unshift({v:d.mins,l:`${d.mins} min`});
    return backBtn("Today") + `<header class="top"><div><h1>Set up your flight</h1><p class="sub">Start when you sit down on the plane.</p></div></header>
      <div class="card"><div class="q"><p>Break every</p>${chips("f:interval",opts,F.interval)}</div><p class="small">Suggested ${d.mins} min. ${esc(d.why)} Change it if your physio or GP has advised otherwise.</p>
      <div class="checks" style="margin-top:12px"><label><input type="checkbox" data-bind="f:awake"${F.awake?" checked":""}>Keep the screen on</label></div>
      <p class="small">Reminders can only sound while the screen is on. Plug into seat power if you can, or set your phone's own timer as a backup.</p></div>
      <div class="card">${legPair("Leg heaviness now","f:pre.heavyL","f:pre.heavyR",F.pre.heavyL,F.pre.heavyR,"None","Worst",false)}</div>
      ${movesCard()}
      <button class="btn primary" data-a="fl-start">Start Flight Mode</button><button class="btn ghost" data-a="fl-cancel">Cancel</button>`;
  }
  if(F.stage==="break"){
    const late = Math.round((Date.now()-F.dueAt)/60000);
    return `<header class="top"><div><h1>Time to move</h1><p class="sub">Break ${F.breaks.filter(b=>!b.skipped).length+1}${late>=2?`, due ${late} min ago`:""}.</p></div></header>
      <div class="card"><h3>Moves</h3>${movesHtml()}</div>
      <div class="card">${legPair("Leg heaviness right now","f:bk.heavyL","f:bk.heavyR",F.bk.heavyL,F.bk.heavyR,"None","Worst",false)}</div>
      <button class="btn primary" data-a="fl-done">Break done</button>
      <div class="row" style="margin-top:10px"><button class="btn" data-a="fl-snooze">Seatbelt sign on, remind me in 10 min</button></div>
      <button class="btn ghost" data-a="fl-skip">Skip this break</button>`;
  }
  if(F.stage==="end"){
    return `<header class="top"><div><h1>Flight finished</h1><p class="sub">${fmtMin((F.endedAt-F.startedAt)/60000)} with ${F.breaks.filter(b=>!b.skipped).length} break${F.breaks.filter(b=>!b.skipped).length===1?"":"s"}.</p></div></header>
      <div class="card">${legPair("Leg heaviness now","f:end.heavyL","f:end.heavyR",F.end.heavyL,F.end.heavyR,"None","Worst",false)}
      <label class="field"><span>Notes</span><textarea class="note" data-bind="f:note" placeholder="What helped, what didn't">${esc(F.note)}</textarea></label></div>
      <button class="btn primary" data-a="fl-save">Save flight</button><button class="btn ghost" data-a="fl-resume-run">Back to the timer</button><button class="btn danger" style="min-height:44px" data-a="fl-discard">Discard this flight</button>`;
  }
  const left = F.paused ? F.pausedLeft/1000 : (F.nextAt-Date.now())/1000;
  const done = F.breaks.filter(b=>!b.skipped), last = done[done.length-1];
  return `<header class="top"><div><h1>Flight Mode</h1><p class="sub">In the air <span id="fl-total">${fmtMin((Date.now()-F.startedAt)/60000)}</span>. ${done.length} break${done.length===1?"":"s"} so far.</p></div></header>
    <div class="card"><div class="ringwrap"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-bg" cx="100" cy="100" r="88"/><circle id="fl-ring" class="ring-fg${F.paused?" rest":""}" cx="100" cy="100" r="88" style="stroke-dashoffset:${(552.9*(1-Math.max(0,Math.min(1,left/(F.interval*60))))).toFixed(1)}"/></svg>
      <div class="ring-center"><div class="ring-phase">${F.paused?"Paused":"Next break"}</div><div class="ring-time" id="fl-time" style="font-size:3.4rem">${hmmss(left)}</div><div class="ring-sub">Every ${F.interval} min</div></div></div>
      ${last?`<p class="small" style="text-align:center">Last break: left ${last.heavyL}, right ${last.heavyR}</p>`:""}
      <div class="row">${F.paused?`<button class="btn primary" data-a="fl-resume">Resume</button>`:`<button class="btn" data-a="fl-pause">Pause for sleep</button>`}<button class="btn" data-a="fl-now">Break now</button></div>
      <button class="btn ghost" data-a="fl-end">Finish flight</button></div>`;
}
function movesCard(){
  const mv = S.settings.flightMoves || [], hasQ = recs(["question"]).some(q=>!q.answered && /flight/i.test(q.text));
  return `<details class="card"${mv.length?"":" open"}><summary>Moves from your physio (${mv.length})</summary>
    <p class="small" style="margin-top:8px">These show at every break. Add what your physio suggests for in your seat and in the aisle.</p>
    ${mv.map((m,k)=>`<div class="q-item"><p>${esc(m)}</p><button class="mini" data-a="mv-del" data-k="${k}">Remove</button></div>`).join("")}
    <label class="field" style="margin-top:10px"><span>Add a move</span><input type="text" id="mv-new" placeholder="For example: 10 seated knee extensions each leg"></label>
    <button class="btn" style="min-height:44px" data-a="mv-add">Add move</button>
    ${!mv.length && !hasQ ? `<button class="btn ghost" data-a="mv-ask">Add "which moves on the flight?" to my questions</button>` : ""}</details>`;

function flightSummary(r){
  const b = r.breaks.filter(x=>!x.skipped), mxL = Math.max(r.pre.heavyL, ...b.map(x=>x.heavyL)), mxR = Math.max(r.pre.heavyR, ...b.map(x=>x.heavyR));
  return `${fmtMin(r.minutes)}, ${b.length} break${b.length===1?"":"s"} every ${r.interval} min${r.breaks.length>b.length?`, ${r.breaks.length-b.length} skipped`:""}. Heaviness at start L ${r.pre.heavyL} R ${r.pre.heavyR}, highest L ${mxL} R ${mxR}, at the end L ${r.end.heavyL} R ${r.end.heavyR}.`;
}

/* ---------- medication patterns ---------- */
function medPattern(cis){
  const out = [];
  [["celecoxib","Celecoxib"],["paracetamol","Paracetamol"]].forEach(([k,name])=>{
    const on = cis.filter(c=>c.meds && c.meds[k]), off = cis.filter(c=>!(c.meds && c.meds[k]));
    if(on.length<3 || off.length<3) return;
    out.push({name, nOn:on.length, nOff:off.length,
      hL:[avg(on.map(c=>c.peakL)), avg(off.map(c=>c.peakL))], hR:[avg(on.map(c=>c.peak)), avg(off.map(c=>c.peak))],
      sit:[avg(on.filter(c=>c.sit!=null&&c.sit<900).map(c=>c.sit)), avg(off.filter(c=>c.sit!=null&&c.sit<900).map(c=>c.sit))]});
  });
  return out;
}
function medTable(rows){
  return rows.map(m=>`<p style="font-weight:600;margin-top:10px">${m.name}: taken ${m.nOn} days, not taken ${m.nOff}</p>
    <div class="tablewrap"><table class="ext"><tr><th></th><th class="n">Taken</th><th class="n">Not taken</th></tr>
    <tr><td>Left worst heaviness</td><td class="n">${f1(m.hL[0])}</td><td class="n">${f1(m.hL[1])}</td></tr>
    <tr><td>Right worst heaviness</td><td class="n">${f1(m.hR[0])}</td><td class="n">${f1(m.hR[1])}</td></tr>
    ${m.sit[0]!=null&&m.sit[1]!=null?`<tr><td>Sitting estimate (min)</td><td class="n">${Math.round(m.sit[0])}</td><td class="n">${Math.round(m.sit[1])}</td></tr>`:""}</table></div>`).join("");
}

  import:viewImport, guide:viewGuide, tol:viewTol, report:viewReport, flight:viewFlight, retest:viewRetest, questions:viewQuestions, symptom:viewSymptom};

  if((S.view==="retest" && !S.rt) || (S.view==="symptom" && !S.sym) || (S.view==="import" && !S.imp) || (S.view==="guide" && !S.guide)) S.view = "home";

function go(v){ S.view = v; if(v!=="program") S.edit = null; if(v==="checkin") openCheckin(); render(false); window.scrollTo(0,0); }

/* ---------- timers ---------- */
const CIRC = 552.9;
const T = {mode:null, running:false, endAt:0, left:0, dur:0, phase:null, set:1, lastSec:null, hold:null};
const R = {on:false, endAt:0, dur:0, last:null};
function resetTimers(){ T.mode=null; T.running=false; T.phase=null; T.set=1; T.hold=null; R.on=false; updRest(); document.getElementById("hold").hidden = true; keepAwake(false); }

function restStart(sec){ R.on = true; R.dur = sec*1000; R.endAt = Date.now()+R.dur; R.last = null; R.over = false; updRest(); }
function updRest(){
  const el = document.getElementById("rest");
  if(!R.on){ el.hidden = true; return; }
  el.hidden = false;
  const left = R.endAt - Date.now();
  document.getElementById("rest-time").textContent = left>0 ? mmss(left/1000) : "Go";
  document.getElementById("rest-fill").style.width = Math.max(0,Math.min(100,(1-left/R.dur)*100))+"%";
  document.getElementById("rest-in").classList.toggle("over", left<=0);
}

function holdStart(i,j,side){
  unlockAudio();
  const ex = S.active.ex[i];
  T.mode = "hold"; T.hold = {i,j,side,secs:ex.secs||30,phase:"ready",start:0};
  T.dur = 5000; T.endAt = Date.now()+T.dur; T.running = true; T.lastSec = null;
  document.getElementById("hold-name").textContent = ex.name + (side ? (side==="L"?", left side":", right side") : "");
  document.getElementById("hold").hidden = false; keepAwake(true); updHold();
}
function updHold(){
  const h = T.hold; if(!h) return;
  const left = T.endAt - Date.now();
  document.getElementById("hold-phase").textContent = h.phase==="ready" ? "Get into position" : "Hold";
  document.getElementById("hold-time").textContent = h.phase==="ready" ? Math.max(0,Math.ceil(left/1000)) : mmss(left/1000);
  const ring = document.getElementById("hold-ring");
  ring.classList.toggle("ready", h.phase==="ready");
  ring.style.strokeDashoffset = (CIRC*(1-Math.max(0,Math.min(1,left/T.dur)))).toFixed(1);
}
function holdFinish(full){
  const h = T.hold; if(!h) return;
  const ex = S.active.ex[h.i], s = ex.log[h.j];
  if(h.phase==="hold"){
    const val = full ? h.secs : Math.min(h.secs, Math.round((Date.now()-h.start)/1000));
    if(h.side) s["secs"+h.side] = val; else s.secs = val;
    if(!ex.sided || (s.secsL!=null && s.secsR!=null)) s.done = true;
  }
  T.mode = null; T.running = false; T.hold = null;
  document.getElementById("hold").hidden = true; keepAwake(false);
  saveActive(); render();
  if(s.done && h.phase==="hold") maybeRest(h.i,h.j);
}
function holdCancel(){ T.mode=null; T.running=false; T.hold=null; document.getElementById("hold").hidden = true; keepAwake(false); }
function maybeRest(i,j){
  const ex = S.active.ex; const lastEx = i===ex.length-1 && j===ex[i].log.length-1;
  if(!lastEx) restStart(S.settings.restSec||90);
}

function ivStart(){
  unlockAudio();
  if(T.mode!=="interval" || !T.phase || T.phase==="done"){ T.mode="interval"; T.phase="ready"; T.set=1; T.dur=5000; T.endAt=Date.now()+5000; }
  else T.endAt = Date.now()+T.left;
  T.running = true; T.lastSec = null; keepAwake(true); render();
}
function ivPause(){ T.left = T.endAt-Date.now(); T.running = false; keepAwake(false); render(); }
function ivReset(){ T.mode=null; T.running=false; T.phase=null; T.set=1; keepAwake(false); render(); }
function ivAdvance(){
  const c = S.active.cond;
  if(T.phase==="ready" || T.phase==="rest"){
    if(T.phase==="rest") T.set++;
    T.phase = "work"; T.dur = c.work*1000; beep(1046,.35); buzz(300);
  } else if(T.phase==="work"){
    c.done = Math.max(c.done||0, T.set); saveActive();
    if(T.set >= c.sets){ T.running=false; T.phase="done"; keepAwake(false); beep(1318,.7); buzz([300,100,300,100,300]); render(); return; }
    T.phase = "rest"; T.dur = c.rest*1000; beep(523,.35); buzz(150);
  }
  T.endAt = Date.now()+T.dur; T.lastSec = null; render();
}
function updIv(ms){
  const t = document.getElementById("iv-time"); if(!t) return;
  t.textContent = mmss(ms/1000);
  const ring = document.getElementById("iv-ring"); if(ring) ring.style.strokeDashoffset = (CIRC*(1-Math.max(0,Math.min(1,ms/T.dur)))).toFixed(1);
}
function tick(){
  const now = Date.now();
  if(R.on){
    const s = Math.ceil((R.endAt-now)/1000);
    if(s!==R.last){ R.last = s; if(s<=3 && s>0) beep(660,.08); if(s===0 && !R.over){ R.over = true; beep(990,.35); buzz([200,100,200]); } }
    updRest();
  }
  if(T.running && T.mode==="interval"){
    const ms = T.endAt-now, s = Math.ceil(ms/1000);
    if(s!==T.lastSec){ T.lastSec = s; if(s<=3 && s>0) beep(784,.08); }
    if(ms<=0) ivAdvance(); else updIv(ms);
  }
  if(T.running && T.mode==="hold" && T.hold){
    const ms = T.endAt-now, s = Math.ceil(ms/1000);
    if(s!==T.lastSec){ T.lastSec = s; if(s<=3 && s>0) beep(784,.08); }
    if(ms<=0){
      if(T.hold.phase==="ready"){ T.hold.phase="hold"; T.hold.start=now; T.dur=T.hold.secs*1000; T.endAt=now+T.dur; T.lastSec=null; beep(1046,.3); buzz(250); }
      else { beep(1318,.5); buzz([250,100,250]); holdFinish(true); return; }
    }
    updHold();
  }
}
setInterval(()=>{ tick(); tolTick(); flightTick(); },250);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(T.running || S.tol || (S.flight && S.flight.awake && ["run","break"].includes(S.flight.stage))) keepAwake(true); flightTick(); tick();  } });

/* ---------- events ---------- */
document.addEventListener("input", e=>{
  const el = e.target, b = el.dataset.bind; if(!b) return;
  let v = el.type==="checkbox" ? el.checked : el.value;
  if(el.dataset.num) v = v==="" ? null : Number(v);
  setBind(b,v);
  if(el.dataset.out){ const o = document.getElementById(el.dataset.out); if(o) o.textContent = v; }
  if(el.dataset.leg) updLeg(el);
  if(el.dataset.rerender) render();
});
document.addEventListener("change", e=>{
  const el = e.target; if(!el || el.type!=="file" || el.dataset.imp!=="backup") return;
  const f = el.files && el.files[0]; el.value = ""; if(f) restoreBackup(f);
});
document.addEventListener("toggle", e=>{ const d = e.target; if(d && d.dataset && d.dataset.ob) S.ob[d.dataset.ob] = d.open; }, true);
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]"); if(!el) return;
  const a = el.dataset.a, A = S.active;
  switch(a){
    case "nav": go(el.dataset.v); break;
    case "start-strength": if(A) ask("You have a session in progress. Discard it and start a new one?","Discard and start",startStrength,{danger:true}); else startStrength(); break;
    case "start-cond": if(A) ask("You have a session in progress. Discard it and start a new one?","Discard and start",startCond,{danger:true}); else startCond(); break;
    case "pick-cond": { const c = S.settings.program.conditioning.find(x=>x.id===el.dataset.id); A.cond = {pid:c.id, erg:c.erg, work:c.work, rest:c.rest, sets:c.sets, rpeTarget:c.rpe, done:0, rpe:null, rOff:false}; saveActive(); render(); break; }
    case "begin": A.stage = "work"; saveActive(); render(false); window.scrollTo(0,0); break;
    case "finish": A.stage = "post"; A.post = A.post || clone(A.pre); R.on = false; updRest(); if(T.running) ivPause(); saveActive(); render(false); window.scrollTo(0,0); break;
    case "back-work": A.stage = "work"; saveActive(); render(false); break;
    case "save-session": {
      const r = clone(A); delete r.stage; r.endedAt = Date.now();
      putRecord(r); S.active = null; saveActive(); resetTimers();
      const d = r.post.heavy - r.pre.heavy, dl = (r.post.heavyL??0) - (r.pre.heavyL??0);
      toast(d>0||dl>0 ? `Saved. ${d>0&&dl>0?"Both legs":d>0?"Right leg":"Left leg"} felt heavier afterwards` : d<0||dl<0 ? "Saved. Legs felt lighter afterwards" : "Session saved");
      go("home"); break;
    }
    case "discard": ask("Discard this session? Nothing will be saved.","Discard session",()=>{ S.active = null; saveActive(); resetTimers(); go("home"); },{danger:true}); break;
    case "step": {
      const b = el.dataset.bind, cur = getPath(rootFor(b[0]), b.slice(2)) || 0;
      setBind(b, Math.max(0, cur + Number(el.dataset.d))); render(); break;
    }
    case "done": {
      const i = +el.dataset.i, j = +el.dataset.j, s = A.ex[i].log[j];
      s.done = !s.done; saveActive(); render();
      if(s.done){ unlockAudio(); maybeRest(i,j); } break;
    }
    case "hold": holdStart(+el.dataset.i, +el.dataset.j, el.dataset.side); break;
    case "hold-stop": holdFinish(false); break;
    case "hold-cancel": holdCancel(); break;
    case "rest-add": R.endAt += 15000; R.dur += 15000; R.over = false; updRest(); break;
    case "rest-sub": R.endAt -= 15000; updRest(); break;
    case "rest-skip": R.on = false; updRest(); break;
    case "roff": { const ex = A.ex[+el.dataset.i]; ex.rOff = !ex.rOff; saveActive(); render(); break; }
    case "roff-c": A.cond.rOff = !A.cond.rOff; saveActive(); render(); break;
    case "loff": { const ex = A.ex[+el.dataset.i]; ex.lOff = !ex.lOff; saveActive(); render(); break; }
    case "loff-c": A.cond.lOff = !A.cond.lOff; saveActive(); render(); break;
    case "iv-start": ivStart(); break;
    case "iv-pause": ivPause(); break;
    case "iv-reset": ivReset(); break;
    case "chip": {
      const b = el.dataset.bind, v = Number(el.dataset.val), cur = getPath(rootFor(b[0]), b.slice(2));
      setBind(b, cur===v && b[0]==="c" ? null : v); render(); break;
    }
    case "ci-save": {
      const c = clone(S.checkin); delete c._fromPrev;
      putRecord(c); S.checkin = clone(c);
      const flagged = Object.values(c.flags||{}).some(Boolean);
      toast(flagged ? "Saved. Please get urgent medical assessment" : "Check-in saved");
      go("home"); break;
    }
    case "hist": S.histTab = el.dataset.v; render(); break;
    case "rec-toggle": S.open[el.dataset.id] = !S.open[el.dataset.id]; render(); break;
    case "rec-del": { const id = el.dataset.id; ask("Delete this entry? This can't be undone.","Delete",()=>{ delRecord(id); render(); },{danger:true}); break; }
    case "prog-reset": ask("Replace your program with the September 2026 sheet? You can go back to this version from Program history.","Reset program",()=>{ const np = clone(DEFAULT_PROGRAM); commitProgram(np,"manual",progDiff(S.settings.program,np),"Reset to September 2026 sheet"); render(); toast("Program reset"); },{danger:true}); break;
    case "copy-program": filesText("Your program", programText(S.settings.program)); break;
    case "pe-add": { const blk = el.dataset.blk;
      S.edit = {blk, k:-1, draft: blk==="conditioning" ? {id:"", erg:"", work:30, rest:30, sets:4, rpe:5} : {id:"x"+Date.now().toString(36), name:"", sets:2, target:"10 reps", kind:"reps", reps:10, rpe:5, notes:"", sided:false, weight:false, kg:null}};
      render(); break; }
    case "pe-edit": S.edit = {blk:el.dataset.blk, k:+el.dataset.k, draft:clone(S.settings.program[el.dataset.blk][+el.dataset.k])}; render(); break;
    case "pe-cancel": S.edit = null; render(); break;
    case "pe-save": {
      const E = S.edit, P2 = clone(S.settings.program), d = clone(E.draft), isC = E.blk==="conditioning";
      if(isC){ d.id = String(d.id||"").trim(); if(!d.id){ toast("Give the session a name or letter"); break; } d.work = d.work||30; d.rest = d.rest??30; d.sets = d.sets||1; }
      else { d.name = String(d.name||"").trim(); if(!d.name){ toast("Give the exercise a name"); break; } d.sets = Math.max(1,d.sets||1); if(!String(d.target||"").trim()) d.target = d.kind==="reps"?`${d.reps||10} reps`:d.kind==="time"?`${d.secs||30} s`:"as set"; if(d.kind==="time" && !d.secs) d.secs = 30; if(d.kind==="reps" && !d.reps) d.reps = 10; }
      const nm = isC ? condName(d) : d.name; const changes = [];
      if(E.k<0){ P2[E.blk].push(d); changes.push({kind:"add", block:E.blk, name:nm}); }
      else { const old = P2[E.blk][E.k]; const det = fieldDiff(old,d,isC?CONDF:EXF); if(!isC && old.name!==d.name) det.unshift(`Renamed from ${old.name}`); if(isC && old.id!==d.id) det.unshift(`Renamed from ${old.id}`); P2[E.blk][E.k] = d; if(det.length) changes.push({kind:"change", block:E.blk, name:nm, details:det}); }
      S.edit = null; toast(commitProgram(P2,"manual",changes) ? (E.k<0?"Added":"Saved") : "No changes"); render(); break;
    }
    case "pe-del": { const E = S.edit, P2 = clone(S.settings.program), old = P2[E.blk][E.k];
      ask("Remove this from your program? Past sessions keep their records.","Remove",()=>{ P2[E.blk].splice(E.k,1); commitProgram(P2,"manual",[{kind:"remove", block:E.blk, name:E.blk==="conditioning"?condName(old):old.name}]); S.edit = null; render(); toast("Removed"); },{danger:true}); break; }
    case "pe-move": { const blk = el.dataset.blk, k = +el.dataset.k, d = +el.dataset.d, P2 = clone(S.settings.program), L = P2[blk];
      if(k+d<0 || k+d>=L.length) break; const it = L[k]; L[k] = L[k+d]; L[k+d] = it;
      commitProgram(P2,"manual",[{kind:"move", block:blk, name:blk==="conditioning"?condName(it):it.name, details:[d<0?"Up one place":"Down one place"]}]); render(); break; }
    case "pe-pause": { const blk = el.dataset.blk, k = +el.dataset.k, P2 = clone(S.settings.program), it = P2[blk][k];
      it.paused = !it.paused; commitProgram(P2,"manual",[{kind:"change", block:blk, name:it.name, details:[it.paused?"Paused":"Resumed"]}]); render(); toast(it.paused?"Paused. Left out of sessions":"Back in your sessions"); break; }
    case "ver-restore": { const v = versionsList().find(x=>x.id===el.dataset.id); if(!v || !v.program) break;
      ask(`Go back to "${versionLabel(v)}"? This becomes a new version, so you can undo it.`,"Go back",()=>{ const np = clone(v.program); commitProgram(np,"manual",progDiff(S.settings.program,np),`Back to ${versionLabel(v)}`); render(false); window.scrollTo(0,0); toast("Program restored"); }); break; }
    case "imp-open": S.imp = {text:"", error:"", result:null, label:"", scope:"changes", restart:false}; go("import"); break;
    case "imp-parse": { const r = parseCode(S.imp.text); if(r.error){ S.imp.error = r.error; render(); break; } Object.assign(S.imp, {error:"", result:r.result, label:r.label, scope:r.scope, restart:r.scope==="full"}); render(false); window.scrollTo(0,0); break; }
    case "pe-add-top": { S.edit = {blk:"gym", k:-1, draft:{id:"x"+Date.now().toString(36), name:"", sets:2, target:"10 reps", kind:"reps", reps:10, rpe:5, notes:"", sided:false, weight:false, kg:null}}; S.ob.gym = true; S.imp = null; go("program"); setTimeout(()=>{ const ed = document.querySelector(".editor"); if(ed) ed.scrollIntoView({block:"start"}); },50); break; }
    case "pe-blk": { if(S.edit && S.edit.k<0){ S.ob[el.dataset.v] = true; S.edit.blk = el.dataset.v; render(); setTimeout(()=>{ const ed = document.querySelector(".editor"); if(ed) ed.scrollIntoView({block:"start"}); },50); } break; }
    case "cue-ask": copyRequest(cueRequest(S.guide)); break;
    case "restore-paste": ask("Paste the backup text","Restore",v=>{ if(v && v.trim()) restoreText(v.trim()); },{text:"Paste your backup here"}); break;
    case "claude-data": filesText("Your data for Claude", claudeData()); break;
    case "imp-discard": S.imp = null; go("program"); break;
    case "imp-apply": { const I = S.imp, r = I.result;
      if(r.cues.length){ S.settings.cues = S.settings.cues || {}; r.cues.forEach(c=>{ S.settings.cues[norm(c.name)] = {card:c.card, at:Date.now(), rating:null}; }); S.settings.updatedAt = Date.now(); persist(); }
      if(!r.changes.length){ S.imp = null; go("program"); toast(`${r.cues.length} cue card${r.cues.length>1?"s":""} saved`); break; }
      commitProgram(r.np,"import",r.changes,(I.label||"Physio plan").trim());
      if(I.restart){ S.settings.programStart = today(); S.settings.updatedAt = Date.now(); persist(); }
      S.imp = null; go("program"); toast("New program applied"); filesReminder("program", programText(S.settings.program)); break; }
    case "back": if(S.view==="tol" && S.tolDraft){ } else if(S.view==="diag"){ go(S.imp ? "import" : "program"); } else if(S.view==="guide"){ const b = S.guideBack; if(S.guide && S.guide.ctl) S.guide.ctl.abort(); S.guide = null; go(b||"program"); } else if(S.view==="import"){ if(S.imp && S.imp.ctl) S.imp.ctl.abort(); S.imp = null; go("program"); } else go("home"); break;
    case "guide": { let g;
      if(el.dataset.src==="a"){ const e = A.ex[+el.dataset.i]; g = {name:e.name, sets:e.log.length, target:e.target, rpe:e.rpeTarget, notes:e.notes, sided:e.sided}; }
      else { const p = S.settings.program[el.dataset.blk][+el.dataset.k]; g = {name:p.name, sets:p.sets, target:p.target, rpe:p.rpe, notes:p.notes, sided:p.sided}; }
      S.guide = g; S.guideBack = S.view==="session" ? "session" : "program"; go("guide"); break; }
    case "cue-ok": setCueRating(1); render(); toast("Good to hear"); break;
    case "cue-video": setCueRating(0); setTimeout(render,300); break;
    case "pick": { const b = el.dataset.bind, v = el.dataset.val, root = rootFor(b[0]); if(!root) break; const path = b.slice(2);
      if(el.dataset.multi){ const cur = (getPath(root,path)||[]).slice(); const i = cur.indexOf(v); if(i>=0) cur.splice(i,1); else cur.push(v); setBind(b,cur); }
      else setBind(b, getPath(root,path)===v && !["q","r"].includes(b[0]) ? null : v);
      render(); break; }
    case "rt-new": S.rt = newRetest(false); go("retest"); break;
    case "rt-baseline": S.rt = newRetest(true); render(); break;
    case "rt-edit": S.rt = clone(S.records[el.dataset.id]); go("retest"); break;
    case "rt-addrow": S.rt.rows.push({test:"", pos:"", L:null, R:null}); render(); break;
    case "rt-delrow": S.rt.rows.splice(+el.dataset.k,1); render(); break;
    case "rt-save": { const r = clone(S.rt); r.rows = r.rows.filter(x=>x.L!=null || x.R!=null);
      if(!r.rows.length && r.extDeficit==null){ toast("Add at least one measurement"); break; }
      if(!r.date) r.date = today(); putRecord(r); S.rt = null; go("trends"); S.histTab = "trends"; render(false); filesReminder("retest", retestText(r)); break; }
    case "q-add": { const t = S.q.text.trim(); if(!t){ toast("Write your question first"); break; }
      putRecord({id:"q-"+uid(), type:"question", date:today(), who:S.q.who, text:t, answered:false, answer:""}); S.q.text = ""; render(); toast("Question added"); break; }
    case "q-answer": { const q = clone(S.records[el.dataset.id]);
      ask("Mark this question answered?","Mark answered",ans=>{ q.answered = true; q.answer = (ans||"").trim(); putRecord(q); render(); },{text:"What was the answer? (optional)"}); break; }
    case "q-reopen": { const q = clone(S.records[el.dataset.id]); q.answered = false; putRecord(q); render(); break; }
    case "tol-start": tolStart(el.dataset.v); break;
    case "tol-onset": tolEnd("onset"); break;
    case "tol-none": tolEnd("none"); break;
    case "tol-stop": tolEnd("stopped"); break;
    case "tol-save": { const d = clone(S.tolDraft); putRecord(d); S.tolDraft = null; go("tol"); toast("Test saved"); break; }
    case "tol-discard": ask("Discard this test?","Discard test",()=>{ S.tolDraft = null; go("tol"); },{danger:true}); break;
    case "rep-open": go("report"); break;
    case "fl-new": flightNew(); break;
    case "fl-cancel": S.flight = null; saveFlight(); go("home"); break;
    case "fl-discard": ask("Discard this flight? Nothing will be saved.","Discard flight",()=>{ S.flight = null; saveFlight(); keepAwake(false); go("home"); },{danger:true}); break;
    case "fl-start": flightStart(); break;
    case "fl-done": { const F = S.flight; F.breaks.push({at:Date.now(), dueAt:F.dueAt, heavyL:F.bk.heavyL, heavyR:F.bk.heavyR, skipped:false}); F.stage = "run"; F.nextAt = Date.now()+F.interval*60000; delete F.bk; saveFlight(); render(false); toast("Break logged"); break; }
    case "fl-snooze": { const F = S.flight; F.snoozes++; F.stage = "run"; F.nextAt = Date.now()+600000; saveFlight(); render(false); break; }
    case "fl-skip": { const F = S.flight; F.breaks.push({at:Date.now(), dueAt:F.dueAt, skipped:true}); F.stage = "run"; F.nextAt = Date.now()+F.interval*60000; saveFlight(); render(false); break; }
    case "fl-now": { const F = S.flight; F.nextAt = Date.now(); saveFlight(); flightTick(); break; }
    case "fl-pause": { const F = S.flight; F.paused = true; F.pausedLeft = Math.max(0,F.nextAt-Date.now()); saveFlight(); keepAwake(false); render(false); break; }
    case "fl-resume": { const F = S.flight; F.paused = false; F.nextAt = Date.now()+(F.pausedLeft||F.interval*60000); saveFlight(); if(F.awake) keepAwake(true); render(false); break; }
    case "fl-end": ask("Finish Flight Mode? You'll rate your legs and save the flight next.","Finish flight",()=>{ const F = S.flight, lb = lastBreakRating(); F.stage = "end"; F.endedAt = Date.now(); F.end = {heavyL:lb.heavyL, heavyR:lb.heavyR}; saveFlight(); keepAwake(false); render(false); window.scrollTo(0,0); }); break;
    case "fl-resume-run": { const F = S.flight; F.stage = "run"; delete F.endedAt; saveFlight(); if(F.awake) keepAwake(true); render(false); break; }
    case "fl-save": { const F = S.flight; putRecord({id:F.id, type:"flight", date:iso(new Date(F.startedAt)), startedAt:F.startedAt, endedAt:F.endedAt, minutes:Math.round((F.endedAt-F.startedAt)/60000), interval:F.interval, pre:F.pre, end:F.end, breaks:F.breaks, snoozes:F.snoozes, note:F.note});
      S.flight = null; saveFlight(); go("home"); toast("Flight saved to your log"); break; }
    case "mv-add": { const v = (document.getElementById("mv-new").value||"").trim(); if(!v) break; S.settings.flightMoves = [...(S.settings.flightMoves||[]), v.slice(0,120)]; setBind("s:updatedAt",Date.now()); render(); break; }
    case "mv-del": { S.settings.flightMoves.splice(+el.dataset.k,1); setBind("s:updatedAt",Date.now()); render(); break; }
    case "mv-ask": putRecord({id:"q-"+uid(), type:"question", date:today(), who:"Physio", text:"Which movements should I do in my seat and in the aisle on my long-haul flight, and how often?", answered:false, answer:""}); render(); toast("Added to your questions"); break;
    case "rep-save": saveReport(); break;
    case "rep-copy": filesText("Report as text", reportText(S.rep.days, S.rep.who)); break;
    case "sym-new": S.sym = newSym(); go("symptom"); break;
    case "sym-save": { const y = clone(S.sym); if(!y.what.length) break; putRecord(y); S.sym = null; go("home"); toast("Saved to your log"); break; }
    case "export": exportData(); break;
    case "modal-close": document.getElementById("modal").hidden = true; break;
    case "cf-yes": { const fn = CF.fn, ta = document.getElementById("cf-text"), v = ta ? ta.value : undefined; CF.fn = null; document.getElementById("modal").hidden = true; if(fn) fn(v); break; }
    case "cf-no": CF.fn = null; document.getElementById("modal").hidden = true; break;
    case "copy": { const ta = document.getElementById("copytext"); try{ navigator.clipboard.writeText(ta.value).then(()=>toast("Copied")); }catch(err){ ta.select(); } break; }
  }
});

/* in-app confirmation, since the Claude app blocks the browser's own pop-ups */
const CF = {fn:null};
function ask(msg, okLabel, fn, opts){
  opts = opts || {};
  CF.fn = fn;
  document.getElementById("modal-body").innerHTML = `<p style="font-weight:600;font-size:1.1rem;margin-bottom:12px">${esc(msg)}</p>
    ${opts.text?`<textarea id="cf-text" class="note" style="min-height:90px;margin-bottom:12px" placeholder="${esc(opts.text)}"></textarea>`:""}
    <div class="row"><button class="btn ${opts.danger?"danger":"primary"}" data-a="cf-yes">${esc(okLabel)}</button><button class="btn" data-a="cf-no">Cancel</button></div>`;
  document.getElementById("modal").hidden = false;
  const ta = document.getElementById("cf-text"); if(ta) setTimeout(()=>ta.focus(),50);
}
function filesText(title, text){
  document.getElementById("modal-body").innerHTML = `<h3>${esc(title)}</h3><textarea id="copytext" readonly>${esc(text)}</textarea><div class="row" style="margin-top:10px"><button class="btn primary" data-a="copy">Copy</button><button class="btn" data-a="modal-close">Close</button></div>`;
  document.getElementById("modal").hidden = false;
}
const Cloud = {db:null, push(){}, pull(){ return Promise.resolve(); }, closeInbox(){}};

/* ---------- start ---------- */
if(S.active) S.view = "session";
else if(S.tol){ S.view = "tol"; keepAwake(true); }
else if(S.flight && S.flight.stage!=="setup"){ S.view = "flight"; if(S.flight.awake) keepAwake(true); }
render(false);
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
})();
</script>
